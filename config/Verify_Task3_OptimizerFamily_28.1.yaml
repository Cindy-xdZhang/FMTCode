experiment: Verify_Task3_OptimizerFamily_28.1
output_root: outputs/Verify_Task3_OptimizerFamily_28.1
task: Task3

# Development-only optimizer-family search. The completed 27.1 selector
# supplies one frozen learning-rate/weight-decay cell and anchored FMT feature
# per physical family. No confirmation population is opened.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

combination_sources:
  optimizer_cell:
    kind: optimization
    selection: outputs/Verify_Task3_LearningRateWeightDecay_27.1/optimization_selection.json
    expected_experiment: Verify_Task3_LearningRateWeightDecay_27.1

# Every optimizer receives the exact family-specific learning rate and weight
# decay selected by 27.1. FMT and train-only Raw-PCA use the same optimizer,
# initialization seed, batches, network, and training budget.
optimization_candidates:
  - {id: p00_control_adamw, sources: [optimizer_cell],
     training: {optimizer: adamw}}
  - {id: p01_adamw_amsgrad, sources: [optimizer_cell],
     training: {optimizer: adamw, optimizer_amsgrad: true}}
  - {id: p02_adam, sources: [optimizer_cell],
     training: {optimizer: adam}}
  - {id: p03_adam_amsgrad, sources: [optimizer_cell],
     training: {optimizer: adam, optimizer_amsgrad: true}}
  - {id: p04_radam, sources: [optimizer_cell],
     training: {optimizer: radam}}
  - {id: p05_nadam, sources: [optimizer_cell],
     training: {optimizer: nadam}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: p00_control_adamw
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
