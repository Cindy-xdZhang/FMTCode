experiment: Verify_Task3_EarlyStoppingMinDelta_81.1
output_root: outputs/Verify_Task3_EarlyStoppingMinDelta_81.1
task: Task3

# Development-only single-factor search frozen before 79.1 produces any
# performance metric. The independently audited 80.1 portfolio supplies one
# complete recipe per physical family. Candidates change only the minimum
# validation-score improvement required to replace the best checkpoint.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  portfolio:
    kind: optimization
    selection: outputs/Verify_Task3_EarlyStoppingPatiencePortfolio_80.1/portfolio_selection.json
    expected_experiment: Verify_Task3_EarlyStoppingPatiencePortfolio_80.1

# This is the only preregistered source value that a candidate may replace.
# Source patience and maximum epoch budget remain protected.
allowed_source_overrides: [training.min_delta]

# d00 preserves each source recipe exactly. A non-control cell changes only
# the minimum validation selection-score improvement. Both paired arms receive
# the same value. The historical source value is expected to be 1e-4 and is
# represented by the exact control rather than a duplicate candidate.
optimization_candidates:
  - {id: d00_control_source, sources: [portfolio]}
  - {id: d01_min_delta000000, sources: [portfolio], training: {min_delta: 0.0}}
  - {id: d02_min_delta000001, sources: [portfolio], training: {min_delta: 0.000001}}
  - {id: d03_min_delta000003, sources: [portfolio], training: {min_delta: 0.000003}}
  - {id: d04_min_delta000010, sources: [portfolio], training: {min_delta: 0.00001}}
  - {id: d05_min_delta000030, sources: [portfolio], training: {min_delta: 0.00003}}
  - {id: d06_min_delta000300, sources: [portfolio], training: {min_delta: 0.0003}}
  - {id: d07_min_delta001000, sources: [portfolio], training: {min_delta: 0.001}}
  - {id: d08_min_delta003000, sources: [portfolio], training: {min_delta: 0.003}}
  - {id: d09_min_delta010000, sources: [portfolio], training: {min_delta: 0.01}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: d00_control_source
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.220
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
