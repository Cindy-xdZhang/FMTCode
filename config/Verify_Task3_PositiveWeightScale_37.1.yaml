experiment: Verify_Task3_PositiveWeightScale_37.1
output_root: outputs/Verify_Task3_PositiveWeightScale_37.1
task: Task3

# Development-only positive-class-weight search. Both paired arms receive the
# same scale, labels, ordering seed, residual head, optimizer, epoch budget,
# and split. The completed 22.1 selector freezes the family-specific anchored
# FMT feature before any 37.1 candidate is trained.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# The earlier broad 7.1 search selected its lower boundary (0.35) for
# Tangaroa and its upper boundary (2.0) for F-22. This independent grid expands
# both ends and adds finer cells around 0.35--0.60. p08 has no override and is
# therefore the exact historical scale-1 control.
optimization_candidates:
  - {id: p00_scale010, sources: [feature],
     training: {positive_weight_scale: 0.10}}
  - {id: p01_scale020, sources: [feature],
     training: {positive_weight_scale: 0.20}}
  - {id: p02_scale030, sources: [feature],
     training: {positive_weight_scale: 0.30}}
  - {id: p03_scale035, sources: [feature],
     training: {positive_weight_scale: 0.35}}
  - {id: p04_scale040, sources: [feature],
     training: {positive_weight_scale: 0.40}}
  - {id: p05_scale050, sources: [feature],
     training: {positive_weight_scale: 0.50}}
  - {id: p06_scale060, sources: [feature],
     training: {positive_weight_scale: 0.60}}
  - {id: p07_scale075, sources: [feature],
     training: {positive_weight_scale: 0.75}}
  - {id: p08_control_scale100, sources: [feature]}
  - {id: p09_scale125, sources: [feature],
     training: {positive_weight_scale: 1.25}}
  - {id: p10_scale150, sources: [feature],
     training: {positive_weight_scale: 1.50}}
  - {id: p11_scale200, sources: [feature],
     training: {positive_weight_scale: 2.00}}
  - {id: p12_scale250, sources: [feature],
     training: {positive_weight_scale: 2.50}}
  - {id: p13_scale300, sources: [feature],
     training: {positive_weight_scale: 3.00}}
  - {id: p14_scale400, sources: [feature],
     training: {positive_weight_scale: 4.00}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: p08_control_scale100
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
