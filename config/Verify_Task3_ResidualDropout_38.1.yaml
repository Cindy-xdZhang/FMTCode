experiment: Verify_Task3_ResidualDropout_38.1
output_root: outputs/Verify_Task3_ResidualDropout_38.1
task: Task3

# Development-only one-factor residual-head dropout search. Both paired arms
# receive the same dropout rate, anchored FMT feature width, labels, ordering
# seed, architecture, optimizer, epoch budget, and split.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# The completed broad 7.1 search tested only dropout 0.10 and 0.20. Both gave
# small family-specific gains for half-cylinder, F-22, Boeing, and Smoke, but
# neither was uniformly best. This finer independent grid covers weak through
# strong regularization. d00 has no local model override and is therefore the
# exact zero-dropout historical control.
optimization_candidates:
  - {id: d00_control_dropout0000, sources: [feature]}
  - {id: d01_dropout0025, sources: [feature], model: {head_dropout: 0.025}}
  - {id: d02_dropout0050, sources: [feature], model: {head_dropout: 0.050}}
  - {id: d03_dropout0075, sources: [feature], model: {head_dropout: 0.075}}
  - {id: d04_dropout0100, sources: [feature], model: {head_dropout: 0.100}}
  - {id: d05_dropout0150, sources: [feature], model: {head_dropout: 0.150}}
  - {id: d06_dropout0200, sources: [feature], model: {head_dropout: 0.200}}
  - {id: d07_dropout0300, sources: [feature], model: {head_dropout: 0.300}}
  - {id: d08_dropout0400, sources: [feature], model: {head_dropout: 0.400}}
  - {id: d09_dropout0500, sources: [feature], model: {head_dropout: 0.500}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: d00_control_dropout0000
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
