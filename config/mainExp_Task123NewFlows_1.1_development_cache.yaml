  hidden_dims: [256, 128]
  latent_dim: 16
  beta: 0.001
  target_optimizer_steps: 4600
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.00001
  training_seeds: [7068, 7069, 7070]
  kmeans_n_init: 20
  kmeans_seed: 7068

output:
  cache_dir: outputs/mainExp_Task123NewFlows_1.1/development_cache
