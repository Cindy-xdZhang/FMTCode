  contrastive:
    selection: outputs/Verify_Task3_SupervisedContrastive_18.1/optimization_selection.json
    expected_experiment: Verify_Task3_SupervisedContrastive_18.1

optimization_candidates:
  - {id: r00_base, sources: []}
