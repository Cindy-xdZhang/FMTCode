    label_cache_root: outputs/mainExp_Task3_3D_3.2_global_ivd/development_labels_new2/labels
    raw_checkpoint_dir: outputs/mainExp_Task3_3D_3.2_global_ivd/development_new2/baselines/checkpoints

screen_split:
  train_ordinals: [0, 1, 2, 3, 4, 5]
  validation_ordinals: [6, 7]
  test_ordinals: []
outer_ordinals: [8, 9]
screen_seeds: [40, 41]
stage2_screen_seeds: [40, 41, 42]

# Stage 1 isolates the feature-block choice. All candidates use the same
# residual architecture and optimization; Stage 2 expands the top three per
# family over residual width, input route, learning rate, and alpha selection.
candidates:
  - {id: c00_all, fmt_feature: fmt_all, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: minimum_gain}
  - {id: c01_real_neighbor, fmt_feature: fmt_real_neighbor,
     residual_input: geometry_fmt, auxiliary_dim: 64,
     selection_metric: minimum_gain}
  - {id: c02_real_imag_neighbor, fmt_feature: fmt_real_imag_neighbor,
     residual_input: geometry_fmt, auxiliary_dim: 64,
     selection_metric: minimum_gain}
  - {id: c03_chirality_neighbor, fmt_feature: fmt_chirality_neighbor,
     residual_input: geometry_fmt, auxiliary_dim: 64,
     selection_metric: minimum_gain}
  - {id: c04_chirality_all, fmt_feature: fmt_chirality_all,
     residual_input: geometry_fmt, auxiliary_dim: 64,
     selection_metric: minimum_gain}
  - {id: c05_gram2, fmt_feature: gram2, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: minimum_gain}
  - {id: c06_kin2, fmt_feature: kin2, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: minimum_gain}
  - {id: c07_kin4, fmt_feature: kin4, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: minimum_gain}
  - {id: c08_kin6, fmt_feature: kin6, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: minimum_gain}
  - {id: c09_all_kin2, fmt_feature: fmt_all+kin2,
     residual_input: geometry_fmt, auxiliary_dim: 64,
     selection_metric: minimum_gain}
  - {id: c10_all_kin4, fmt_feature: fmt_all+kin4,
     residual_input: geometry_fmt, auxiliary_dim: 64,
     selection_metric: minimum_gain}
  - {id: c11_real_kin4, fmt_feature: fmt_real_neighbor+kin4,
     residual_input: geometry_fmt, auxiliary_dim: 64,
     selection_metric: minimum_gain}
  - {id: c12_gram2_kin4, fmt_feature: gram2+kin4,
     residual_input: geometry_fmt, auxiliary_dim: 64,
     selection_metric: minimum_gain}
  - {id: c13_real_gram2_kin4,
     fmt_feature: fmt_real_neighbor+gram2+kin4,
     residual_input: geometry_fmt, auxiliary_dim: 64,
     selection_metric: minimum_gain}

# Stage 2 combines each family's three retained feature blocks with these
# residual-network and fusion choices.
stage2_networks:
  - {id: n00_geom_aux64_min, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: minimum_gain}
  - {id: n01_fmt_only_aux64_min, residual_input: fmt_only,
     auxiliary_dim: 64, selection_metric: minimum_gain}
  - {id: n02_dual_aux64_min, residual_input: dual,
     auxiliary_dim: 64, selection_metric: minimum_gain}
  - {id: n03_geom_aux32_min, residual_input: geometry_fmt,
     auxiliary_dim: 32, selection_metric: minimum_gain}
  - {id: n04_geom_aux96_min, residual_input: geometry_fmt,
     auxiliary_dim: 96, selection_metric: minimum_gain}
  - {id: n05_geom_lr3e4_min, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: minimum_gain,
     training: {learning_rate: 0.0003}}
  - {id: n06_geom_lr3e3_min, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: minimum_gain,
     training: {learning_rate: 0.003}}
  - {id: n07_geom_constrained, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: constrained_average_precision,
     minimum_f1_gain: 0.03}
  - {id: n08_geom_f1, residual_input: geometry_fmt,
     auxiliary_dim: 64, selection_metric: f1}
  - {id: n09_geom_fixed1, residual_input: geometry_fmt,
     auxiliary_dim: 64, fixed_alpha: 1.0,
     selection_metric: average_precision}

training:
  device: auto
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 100
  patience: 20
  min_delta: 0.0001

selection:
  top_k: 3
  allowed_fmt_below_strong_raw: 0.005
  target_dataset_macro_f1_gain: 0.15
  stage1_selection_file: outputs/Verify_Task3_FMTResidualFamilySearch_4.1/stage1_selection.json
  stage2_top_k: 3
