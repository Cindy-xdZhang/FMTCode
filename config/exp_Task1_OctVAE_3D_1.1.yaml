# Task1 arm: octahedral-equivariant SIREN-VAE on the existing Task1 caches.
# Splits, calibration ordinals and confirmation slices are identical to the
# Raw/FMT arms, so only the representation differs between arms.
experiment: exp_Task1_OctVAE_3D_1.1
group: oh                 # oh = 48 elements (rotations + reflections); o = 24 proper rotations
device: cuda
sampled_steps: 32         # per-line resample count in the cache; signal is 31 rates

# The VAE never sees ordinals 8-9 or any confirmation slice.  Its checkpoint is
# picked by Davies-Bouldin on 6-7, which uses no labels at all.
splits:
  vae_train: [0, 1, 2, 3, 4, 5]
  vae_validation: [6, 7]
  kmeans_train: [0, 1, 2, 3, 4, 5, 6, 7]
  cluster_calibration: [8, 9]

train_seeds: [7068, 7069, 7070]
kmeans_seeds: [7068, 7069, 7070, 7071, 7072]
kmeans_n_init: 20        # matches the n_init the exp_Task1_* baselines used
encode_batch_size: 4096
readouts: [plain, gmean, gmax, gmeanmax]

model:
  z_inv_dim: 16
  z_eq_dim: 12
  dec_hidden: 128
  dec_layers: 4
  w0: 30.0
  w0_first: 30.0

training:
  steps: 28000
  batch_size: 256
  lr: 5.0e-4
  encoder_lr_scale: 0.1          # refinement 1
  weight_decay: 1.0e-4
  beta: 1.0e-4
  lambda_contrast: 15.0
  zinv_var_weight: 5.0
  zinv_cov_weight: 0.2
  zinv_target_std: 0.5
  clip_sigma: 5.0
  recon_channel_balance: true    # refinement 2
  eval_every: 250                # refinement 3 cadence
  selection_warmup: 2800
  selection_subsample: 8192
  kmeans_n_init: 10
  decoder_finetune_steps: 4000   # refinement 4
  decoder_finetune_lr: 5.0e-4

# Published values are the frozen unified-config Task1 main table in
# docs/paper_tables_tasks_3d.md (fmt_all+kin4 -> PCA8 for FMT, Raw-PCA2 for Raw).
# The measured baselines below reuse the family recipes selected in
# outputs/exp_Task1_*/selected_configs.json on these same caches.
datasets:
  - id: halfcylinderRe160_eth
    family: halfcylinder
    label: Half-cylinder Re160
    development_cache: outputs/exp_Task1_ReSweep_0.1/development_cache/halfcylinderRe160_eth
    confirmation_cache: outputs/exp_Task1_ReSweep_0.1/confirmation_cache/halfcylinderRe160_eth
    published: {fmt_f1: 0.5958, raw_f1: 0.3834, gain: 0.2125, ari: 0.4820, nmi: 0.3182}
    prior_run: {fmt_f1: 0.522489, raw_f1: 0.218807, ari: 0.395565}   # outputs/exp_Task1_*/paper_table.csv
    baselines:
      - {name: raw, feature: raw, pca_dim: 2}
      - {name: fmt, feature: fmt_all+kin4, pca_dim: null}
  - id: halfcylinderRe640_eth
    family: halfcylinder
    label: Half-cylinder Re640
    development_cache: outputs/exp_Task1_ReSweep_0.1/development_cache/halfcylinderRe640_eth
    confirmation_cache: outputs/exp_Task1_ReSweep_0.1/confirmation_cache/halfcylinderRe640_eth
    published: {fmt_f1: 0.5687, raw_f1: 0.3356, gain: 0.2331, ari: 0.4631, nmi: 0.3149}
    prior_run: {fmt_f1: 0.517673, raw_f1: 0.339586, ari: 0.451426}   # outputs/exp_Task1_*/paper_table.csv
    baselines:
      - {name: raw, feature: raw, pca_dim: 2}
      - {name: fmt, feature: fmt_all+kin4, pca_dim: null}
  - id: halfcylinderRe6400_eth
    family: halfcylinder
    label: Half-cylinder Re6400
    development_cache: outputs/exp_Task1_ReSweep_0.1/development_cache/halfcylinderRe6400_eth
    confirmation_cache: outputs/exp_Task1_ReSweep_0.1/confirmation_cache/halfcylinderRe6400_eth
    published: {fmt_f1: 0.5331, raw_f1: 0.4190, gain: 0.1142, ari: 0.4748, nmi: 0.2836}
    prior_run: {fmt_f1: 0.535068, raw_f1: 0.359715, ari: 0.472474}   # outputs/exp_Task1_*/paper_table.csv
    baselines:
      - {name: raw, feature: raw, pca_dim: 2}
      - {name: fmt, feature: fmt_all+kin4, pca_dim: null}
  - id: tangaroa_eth
    family: tangaroa
    label: Tangaroa
    development_cache: outputs/exp_Task1_Tangaroa_0.1/development_cache/tangaroa_eth
    confirmation_cache: outputs/exp_Task1_Tangaroa_0.1/confirmation_cache/tangaroa_eth
    published: {fmt_f1: 0.7450, raw_f1: 0.5453, gain: 0.1996, ari: 0.7024, nmi: 0.5049}
    prior_run: {fmt_f1: 0.726076, raw_f1: 0.57517, ari: 0.678924}   # outputs/exp_Task1_*/paper_table.csv
    baselines:
      - {name: raw, feature: raw, pca_dim: 8}
      - {name: fmt, feature: fmt_all, pca_dim: null}

output:
  result_dir: outputs/exp_Task1_OctVAE_3D_1.1
