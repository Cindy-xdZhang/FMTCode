# The complete 2^11 factorial would require 2,048 candidates. This fixed grid
# tests every selected factor alone, every interaction with the strongest
# relative-gain factor (alpha), and four scientifically grouped stacks. A
# source that later selects its exact control remains in the declared recipe;
# data-dependent candidate deletion is forbidden.
optimization_candidates:
  - {id: k00_feature_control, sources: [feature]}
  - {id: k01_alpha, sources: [feature, alpha]}
  - {id: k02_clipping, sources: [feature, clipping]}
  - {id: k03_betas, sources: [feature, betas]}
  - {id: k04_batch, sources: [feature, batch]}
  - {id: k05_positive_weight, sources: [feature, positive_weight]}
  - {id: k06_dropout, sources: [feature, dropout]}
  - {id: k07_focal, sources: [feature, focal]}
  - {id: k08_ema, sources: [feature, ema]}
  - {id: k09_smoothing, sources: [feature, smoothing]}
  - {id: k10_epsilon, sources: [feature, epsilon]}
  - {id: k11_cosine, sources: [feature, cosine]}
  - {id: k12_alpha_clipping, sources: [feature, alpha, clipping]}
  - {id: k13_alpha_betas, sources: [feature, alpha, betas]}
  - {id: k14_alpha_batch, sources: [feature, alpha, batch]}
  - {id: k15_alpha_positive_weight,
     sources: [feature, alpha, positive_weight]}
  - {id: k16_alpha_dropout, sources: [feature, alpha, dropout]}
  - {id: k17_alpha_focal, sources: [feature, alpha, focal]}
  - {id: k18_alpha_ema, sources: [feature, alpha, ema]}
  - {id: k19_alpha_smoothing, sources: [feature, alpha, smoothing]}
  - {id: k20_alpha_epsilon, sources: [feature, alpha, epsilon]}
  - {id: k21_alpha_cosine, sources: [feature, alpha, cosine]}
  - {id: k22_optimizer_stack,
     sources: [feature, alpha, clipping, betas, epsilon]}
  - {id: k23_loss_regularization_stack,
     sources: [feature, alpha, positive_weight, dropout, focal, smoothing]}
  - {id: k24_stability_stack,
     sources: [feature, alpha, batch, ema, cosine]}
  - {id: k25_all_non_scheduler,
     sources: [feature, alpha, clipping, betas, batch, positive_weight,
               dropout, focal, ema, smoothing, epsilon]}
  - {id: k26_all,
     sources: [feature, alpha, clipping, betas, batch, positive_weight,
               dropout, focal, ema, smoothing, epsilon, cosine]}
  - {id: k27_all_without_alpha,
     sources: [feature, clipping, betas, batch, positive_weight, dropout,
               focal, ema, smoothing, epsilon, cosine]}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: k00_feature_control
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
