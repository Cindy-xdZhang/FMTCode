experiment: Verify_Task3_PairwiseRanking_10.1
output_root: outputs/Verify_Task3_PairwiseRanking_10.1
task: Task3

# Orthogonal development-only search around the frozen 5.2 family recipes
# and 6.1 deep-MLP winner.  It does not consume rankings from 7.1-9.1 and
# never opens the final/confirmation population.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

# Every positive/negative pair in a mini-batch receives the same smooth
# ranking objective in both the FMT and same-width train-only Raw-PCA arm.
# The loss encourages positive logits to exceed negative logits by `margin`.
optimization_candidates:
  - {id: q00_control}
  - {id: q01_weight001, training: {pairwise_ranking_loss_weight: 0.01}}
  - {id: q02_weight003, training: {pairwise_ranking_loss_weight: 0.03}}
  - {id: q03_weight010, training: {pairwise_ranking_loss_weight: 0.10}}
  - {id: q04_weight030, training: {pairwise_ranking_loss_weight: 0.30}}
  - {id: q05_weight100, training: {pairwise_ranking_loss_weight: 1.00}}
  - {id: q06_margin05,
     training: {pairwise_ranking_loss_weight: 0.10,
                pairwise_ranking_margin: 0.5}}
  - {id: q07_margin10,
     training: {pairwise_ranking_loss_weight: 0.10,
                pairwise_ranking_margin: 1.0}}
  - {id: q08_margin20,
     training: {pairwise_ranking_loss_weight: 0.10,
                pairwise_ranking_margin: 2.0}}
  - {id: q09_margin40,
     training: {pairwise_ranking_loss_weight: 0.10,
                pairwise_ranking_margin: 4.0}}
  - {id: q10_margin10_temp025,
     training: {pairwise_ranking_loss_weight: 0.10,
                pairwise_ranking_margin: 1.0,
                pairwise_ranking_temperature: 0.25}}
  - {id: q11_margin10_temp050,
     training: {pairwise_ranking_loss_weight: 0.10,
                pairwise_ranking_margin: 1.0,
                pairwise_ranking_temperature: 0.5}}
  - {id: q12_margin10_temp200,
     training: {pairwise_ranking_loss_weight: 0.10,
                pairwise_ranking_margin: 1.0,
                pairwise_ranking_temperature: 2.0}}
  - {id: q13_weight030_margin10_temp050,
     training: {pairwise_ranking_loss_weight: 0.30,
                pairwise_ranking_margin: 1.0,
                pairwise_ranking_temperature: 0.5}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_average_precision_gain_vs_raw_pca
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  target_dataset_macro_f1_gain: 0.15
  confirmation_opened: false
