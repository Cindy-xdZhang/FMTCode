experiment: Verify_Task5_CylinderHyperparams_1.1
source_cache_root: outputs/mainExp_Task5_3D_1.1/development_cache
label_cache_root: outputs/mainExp_Task5_3D_1.1/development_labels_old8/labels
output_root: outputs/Verify_Task5_CylinderHyperparams_1.1
datasets: [cylinder3d, halfcylinderRe640]
expected_slices: 6
sampled_steps: 32
raw_pca_random_state: 7068
raw_wide_parameter_count: 148225
screen_seeds: [60, 61]
screen_split:
  train_ordinals: [0, 1, 2]
  validation_ordinals: [3]
  test_ordinals: []
outer_ordinals: [4, 5]
training: &training
  device: auto
  batch_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  max_epochs: 100
  patience: 20
  min_delta: 0.0001

# Candidate selection maximizes the worst development-validation gain across
# both Reynolds numbers, both metrics, matched Raw-PCA, and stronger Raw.
# No candidate may read ordinals 4--5 during selection.
