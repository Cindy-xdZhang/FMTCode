    development_cache: outputs/Verify_Task2Universality_1.1/cache
    source_config: config/Verify_Task2Universality_1.1.yaml
    fmt_feature: fmt_real_neighbor
    source_architecture_id: s128_l8_b1e-6
    base_vae: {hidden_dims: [128, 64], control_latent_dim: 8,
               beta: 0.000001, learning_rate: 0.001,
               optimizer_steps: 4600, relational_weight: 0.0,
               pair_count: 2048}
  deltaWing:
    datasets: [deltaWing_resampled, deltaWing_LBM]
    development_cache: outputs/Verify_Task2Universality_1.1/cache
    source_config: config/Verify_Task2Universality_1.1.yaml
    fmt_feature: fmt_all
    source_architecture_id: lin8_b1e-6
    base_vae: {hidden_dims: [], control_latent_dim: 8,
               beta: 0.000001, learning_rate: 0.001,
               optimizer_steps: 4600, relational_weight: 0.0,
               pair_count: 2048}
  f22raptor:
    datasets: [f22raptor]
    development_cache: outputs/Verify_Task2Universality_1.1/cache
    source_config: config/Verify_Task2Universality_1.1.yaml
    fmt_feature: fmt_all+kin4
    source_architecture_id: m256_l16_b1e-6
    base_vae: {hidden_dims: [256, 128], control_latent_dim: 16,
               beta: 0.000001, learning_rate: 0.001,
               optimizer_steps: 4600, relational_weight: 0.0,
               pair_count: 2048}
  boeing747:
    datasets: [boeing747]
    development_cache: outputs/mainExp_Task123NewFlows_1.1/development_cache
    source_config: config/mainExp_Task123NewFlows_1.1_development_cache.yaml
    fmt_feature: kin2
    source_architecture_id: lin4_b1e-6
    base_vae: {hidden_dims: [], control_latent_dim: 4,
               beta: 0.000001, learning_rate: 0.001,
               optimizer_steps: 4600, relational_weight: 0.0,
               pair_count: 2048}
  smokeBuoyancy:
