experiment: Verify_Task3_HeadAlphaClipCombination_45.1
output_root: outputs/Verify_Task3_HeadAlphaClipCombination_45.1
task: Task3

# Adaptive development combination declared from three completed selectors.
# It fills the head-factor omission in 44.1 without reading any 36.1--44.1
# partial metric. Preflight freezes every source SHA-256 and family winner.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1
  head:
    selection: outputs/Verify_Task3_ResidualHeadDepthWidth_31.2/optimization_selection.json
    expected_experiment: Verify_Task3_ResidualHeadDepthWidth_31.2
  alpha:
    selection: outputs/Verify_Task3_TrainingResidualScale_32.1/optimization_selection.json
    expected_experiment: Verify_Task3_TrainingResidualScale_32.1
  clipping:
    selection: outputs/Verify_Task3_GradientClipping_33.1/optimization_selection.json
    expected_experiment: Verify_Task3_GradientClipping_33.1

# Complete binary factorial over the three selected trainable factors. Feature
# is present in every recipe and k00 is the exact anchored-feature control.
optimization_candidates:
  - {id: k00_feature_control, sources: [feature]}
  - {id: k01_head, sources: [feature, head]}
  - {id: k02_alpha, sources: [feature, alpha]}
  - {id: k03_clipping, sources: [feature, clipping]}
  - {id: k04_head_alpha, sources: [feature, head, alpha]}
  - {id: k05_head_clipping, sources: [feature, head, clipping]}
  - {id: k06_alpha_clipping, sources: [feature, alpha, clipping]}
  - {id: k07_head_alpha_clipping,
     sources: [feature, head, alpha, clipping]}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: k00_feature_control
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
