experiment: Verify_Task3_ResidualOutputInitialization_30.1
output_root: outputs/Verify_Task3_ResidualOutputInitialization_30.1
task: Task3

# Development-only residual-output initialization search. This grid was fixed
# before reading any partial or final 25.1--29.1 performance result. It freezes
# the completed 22.1 anchored FMT feature and the 5.2 development populations.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# i00 is the byte-compatible PyTorch default. All non-default cells set every
# inference-time residual output bias to zero and change only terminal output
# weights. The same rule is applied unchanged to FMT and train-only Raw-PCA.
optimization_candidates:
  - {id: i00_control_default, sources: [feature],
     model: {residual_output_initialization: default,
             residual_output_initialization_scale: 1.0}}
  - {id: i01_zero, sources: [feature],
     model: {residual_output_initialization: zero,
             residual_output_initialization_scale: 0.0}}
  - {id: i02_normal_1em4, sources: [feature],
     model: {residual_output_initialization: normal,
             residual_output_initialization_scale: 0.0001}}
  - {id: i03_normal_1em3, sources: [feature],
     model: {residual_output_initialization: normal,
             residual_output_initialization_scale: 0.001}}
  - {id: i04_normal_5em3, sources: [feature],
     model: {residual_output_initialization: normal,
             residual_output_initialization_scale: 0.005}}
  - {id: i05_normal_1em2, sources: [feature],
     model: {residual_output_initialization: normal,
             residual_output_initialization_scale: 0.01}}
  - {id: i06_normal_2p5em2, sources: [feature],
     model: {residual_output_initialization: normal,
             residual_output_initialization_scale: 0.025}}
  - {id: i07_normal_5em2, sources: [feature],
     model: {residual_output_initialization: normal,
             residual_output_initialization_scale: 0.05}}
  - {id: i08_xavier_gain01, sources: [feature],
     model: {residual_output_initialization: xavier_uniform,
             residual_output_initialization_scale: 0.1}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: i00_control_default
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
