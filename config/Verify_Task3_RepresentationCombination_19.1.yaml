  - {id: r02_bottleneck, sources: [bottleneck]}
  - {id: r03_contrastive, sources: [contrastive]}
  - {id: r04_core_bottleneck, sources: [core, bottleneck]}
  - {id: r05_core_contrastive, sources: [core, contrastive]}
