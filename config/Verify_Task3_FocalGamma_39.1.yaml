experiment: Verify_Task3_FocalGamma_39.1
output_root: outputs/Verify_Task3_FocalGamma_39.1
task: Task3

# Development-only one-factor focal-loss gamma search. Both paired arms
# receive the same loss, gamma, anchored feature width, labels, ordering seed,
# architecture, optimizer, epoch budget, and split.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# The completed broad 7.1 search selected gamma 3 for Channel, gamma 1 for the
# half-cylinder family, and gamma 2 for Boeing. This focused independent grid
# retests that signal on the stronger completed 22.1 representation and closes
# the upper range. f00 has no local training override and is the exact weighted
# binary-cross-entropy historical control.
optimization_candidates:
  - {id: f00_control_weighted_bce, sources: [feature]}
  - {id: f01_gamma010, sources: [feature], training: {loss: focal, focal_gamma: 0.10}}
  - {id: f02_gamma025, sources: [feature], training: {loss: focal, focal_gamma: 0.25}}
  - {id: f03_gamma050, sources: [feature], training: {loss: focal, focal_gamma: 0.50}}
  - {id: f04_gamma075, sources: [feature], training: {loss: focal, focal_gamma: 0.75}}
  - {id: f05_gamma100, sources: [feature], training: {loss: focal, focal_gamma: 1.00}}
  - {id: f06_gamma150, sources: [feature], training: {loss: focal, focal_gamma: 1.50}}
  - {id: f07_gamma200, sources: [feature], training: {loss: focal, focal_gamma: 2.00}}
  - {id: f08_gamma250, sources: [feature], training: {loss: focal, focal_gamma: 2.50}}
  - {id: f09_gamma300, sources: [feature], training: {loss: focal, focal_gamma: 3.00}}
  - {id: f10_gamma400, sources: [feature], training: {loss: focal, focal_gamma: 4.00}}
  - {id: f11_gamma500, sources: [feature], training: {loss: focal, focal_gamma: 5.00}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: f00_control_weighted_bce
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
