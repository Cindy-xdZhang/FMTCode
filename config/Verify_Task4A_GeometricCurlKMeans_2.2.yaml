experiment: Verify_Task4A_GeometricCurlKMeans_2.2
task: Task4-a time-parameterized streamline-geometry KMeans proxy development
seed: 7068

input:
  fmt_result: outputs/Other_Task4A_FMTStreamlineClustering_1.1/channel_GTs/task4a_clustering_result.npz
  proxy_result: outputs/Verify_Task4A_VelocityCurlBaseline_1.1/channel_GTs/velocity_curl_baseline_result.npz
  flow_path_candidates:
    - "C:/Users/xingdi/OneDrive - KAUST/WorkingInProcess/FLowVisAssets/flowData3D/channel_flow/channel.vtk"
    - "/home/zhanx0o/DeepVortex/FLowDataFolder/channel.vtk"

geometry_search:
  integration: time_parameterized_bidirectional_RK4_dxdt_equals_velocity
  time_step_mean_voxel_over_median_speed_scales: [0.01, 0.025, 0.05, 0.1, 0.25, 0.5]
  cross_offset_min_voxel_scales: [0.1, 0.25, 0.5, 1.0]
  phase1_steps_per_direction: 1
  signed_margin_temperatures: [0.005, 0.01, 0.02, 0.05, 0.1]
  minimum_speed: 1.0e-6
  minimum_vector_norm: 1.0e-9
  chunk_size: 8192

phase1_kmeans:
  scaling: within_vortex
  init: k-means++
  n_init: 5
  max_iter: 300
  tol: 1.0e-5
  algorithm: lloyd

phase2_steps_per_direction: [1, 2, 4, 8, 16, 32]
phase2_kmeans_variants:
  - id: kpp_n1
    scaling: within_vortex
    init: k-means++
    n_init: 1
    max_iter: 300
    tol: 1.0e-4
    algorithm: lloyd
  - id: kpp_n5
    scaling: within_vortex
    init: k-means++
    n_init: 5
    max_iter: 300
    tol: 1.0e-5
    algorithm: lloyd
  - id: kpp_n20_strict
    scaling: within_vortex
    init: k-means++
    n_init: 20
    max_iter: 1000
    tol: 1.0e-6
    algorithm: lloyd
  - id: random_n20_strict
    scaling: within_vortex
    init: random
    n_init: 20
    max_iter: 1000
    tol: 1.0e-6
    algorithm: lloyd

selection:
  primary: geometry_named_vortex_equal_weighted_macro_f1
  secondary: geometry_named_vortex_equal_weighted_hard_label_mse
  success_macro_f1_at_least: 0.90
  success_hard_label_mse_at_most: 0.10
  status: development_on_proxy_not_independent_confirmation

output_dir: outputs/Verify_Task4A_GeometricCurlKMeans_2.2/channel_GTs
