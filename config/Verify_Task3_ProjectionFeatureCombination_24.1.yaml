experiment: Verify_Task3_ProjectionFeatureCombination_24.1
output_root: outputs/Verify_Task3_ProjectionFeatureCombination_24.1
task: Task3

# Development-only 2x2 combination. The completed 20.1, 21.1, and 22.1
# selectors are the only sources of family-specific width, projection, and FMT
# feature choices. No partial array result or confirmation population is read.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

combination_sources:
  ultranarrow:
    selection: outputs/Verify_Task3_UltraNarrowBottleneck_20.1/optimization_selection.json
    expected_experiment: Verify_Task3_UltraNarrowBottleneck_20.1
  projection:
    selection: outputs/Verify_Task3_AuxiliaryProjection_21.1/optimization_selection.json
    expected_experiment: Verify_Task3_AuxiliaryProjection_21.1
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# c00 exactly reconstructs 20.1: its selected ultra-narrow width plus the
# historical linear->LayerNorm->GELU projection. c01 changes projection only;
# c02 changes FMT feature only; c03 combines both completed selectors.
optimization_candidates:
  - id: c00_control
    sources: [ultranarrow]
    model:
      auxiliary_projection: linear_layernorm_gelu
      auxiliary_hidden_dim: 64
  - id: c01_projection
    sources: [projection]
  - id: c02_feature
    sources: [ultranarrow, feature]
    model:
      auxiliary_projection: linear_layernorm_gelu
      auxiliary_hidden_dim: 64
  - id: c03_projection_feature
    sources: [projection, feature]

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_f1
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: c00_control
    f1_tolerance: 0.002
    average_precision_tolerance: 0.002
  target_dataset_macro_f1_gain: 0.175
  target_absolute_fmt_f1: 0.887
  confirmation_opened: false
