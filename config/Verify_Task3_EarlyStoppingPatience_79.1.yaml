experiment: Verify_Task3_EarlyStoppingPatience_79.1
output_root: outputs/Verify_Task3_EarlyStoppingPatience_79.1
task: Task3

# Development-only single-factor search frozen while 75.1 is incomplete and
# before any 75.1 performance metric is read. The independently audited 78.1
# portfolio supplies one complete recipe per physical family. Candidates
# change only early-stopping patience; the maximum epoch budget is preserved.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  portfolio:
    kind: optimization
    selection: outputs/Verify_Task3_AuxiliaryGradientClipPortfolio_78.1/portfolio_selection.json
    expected_experiment: Verify_Task3_AuxiliaryGradientClipPortfolio_78.1

# The resolver rejects source-value replacement by default. This exact path is
# the preregistered factor under test; every other frozen 78.1 field remains
# protected from local replacement.
allowed_source_overrides: [training.patience]

# p00 preserves each source recipe exactly. A non-control cell replaces only
# the number of consecutive non-improving validation epochs tolerated before
# stopping. Both arms retain the same candidate and maximum epoch budget.
optimization_candidates:
  - {id: p00_control_source, sources: [portfolio]}
  - {id: p01_patience003, sources: [portfolio], training: {patience: 3}}
  - {id: p02_patience005, sources: [portfolio], training: {patience: 5}}
  - {id: p03_patience010, sources: [portfolio], training: {patience: 10}}
  - {id: p04_patience015, sources: [portfolio], training: {patience: 15}}
  - {id: p05_patience020, sources: [portfolio], training: {patience: 20}}
  - {id: p06_patience030, sources: [portfolio], training: {patience: 30}}
  - {id: p07_patience050, sources: [portfolio], training: {patience: 50}}
  - {id: p08_patience080, sources: [portfolio], training: {patience: 80}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: p00_control_source
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.219
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
