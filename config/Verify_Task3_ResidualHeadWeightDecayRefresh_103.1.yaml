experiment: Verify_Task3_ResidualHeadWeightDecayRefresh_103.1
output_root: outputs/Verify_Task3_ResidualHeadWeightDecayRefresh_103.1
task: Task3

# Frozen before 101.1 can produce any performance metric. The independently
# audited 102.1 portfolio supplies one complete recipe per physical family.
# The exact source is the control; remaining candidates change only the
# downstream residual-head weight decay.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  portfolio:
    kind: optimization
    selection: outputs/Verify_Task3_ResidualHeadLearningRateRefreshPortfolio_102.1/portfolio_selection.json
    expected_experiment: Verify_Task3_ResidualHeadLearningRateRefreshPortfolio_102.1

allowed_source_overrides: [training.residual_head_weight_decay_multiplier]

# w00 preserves the complete 102.1 source recipe. Each remaining cell scales
# the optimizer weight decay of all trainable parameters outside fmt_encoder;
# the frozen Raw backbone is excluded and the source auxiliary-projection
# optimizer settings remain unchanged.
optimization_candidates:
  - {id: w00_control_source, sources: [portfolio]}
  - {id: w01_headwd0, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 0.0}}
  - {id: w02_headwd001, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 0.01}}
  - {id: w03_headwd005, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 0.05}}
  - {id: w04_headwd010, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 0.10}}
  - {id: w05_headwd025, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 0.25}}
  - {id: w06_headwd050, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 0.50}}
  - {id: w07_headwd200, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 2.00}}
  - {id: w08_headwd400, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 4.00}}
  - {id: w09_headwd1000, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 10.00}}
  - {id: w10_headwd10000, sources: [portfolio], training: {residual_head_weight_decay_multiplier: 100.00}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: w00_control_source
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.242
  target_absolute_fmt_f1: 0.904
  confirmation_opened: false
