<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hairpin · 曲线形状贡献</title>
<style>
:root{font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;color:#243b42;background:#f3f5f5}*{box-sizing:border-box}body{margin:0}header{height:82px;background:white;border-bottom:1px solid #dae2e4;padding:15px 24px;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0;font-weight:600}.muted{font-size:12px;color:#667f88}.badge{background:#e8f1f1;padding:6px 10px;border-radius:6px;font-size:12px}main{display:grid;grid-template-columns:292px 1fr;height:calc(100vh - 82px);min-height:580px}aside{padding:17px 19px;background:#fbfcfc;border-right:1px solid #dce4e6;overflow:auto}label{display:block;font-size:12px;color:#57717a;margin:0 0 13px}select,input[type=number]{display:block;width:100%;padding:7px 8px;margin-top:5px;border:1px solid #cddadd;border-radius:5px;background:white;color:#243b42;font:inherit}input[type=range]{width:100%;accent-color:#20868d}.row{display:flex;align-items:center;gap:8px}.row>*{flex:1}button{cursor:pointer;border:1px solid #cbdadd;border-radius:5px;background:#edf3f4;color:#294e57;padding:8px;font:inherit;font-size:12px}button:hover{background:#dfecee}button:disabled{opacity:.45;cursor:default}.section{border-top:1px solid #dce5e7;padding-top:14px;margin-top:16px}.check{display:flex;align-items:center;gap:7px;margin:11px 0}.check input{accent-color:#258990}.wide{width:100%}.legend{height:9px;border-radius:4px;margin:9px 0 4px;background:linear-gradient(90deg,#2868bd,#f5f4ed,#c44138)}.ends{display:flex;justify-content:space-between;font-size:11px;color:#65808a}#explanation{font-size:12px;margin-top:10px;color:#506d76}article{display:flex;flex-direction:column;min-width:0}.metrics{display:flex;gap:28px;padding:13px 24px;background:#f9fbfb;min-height:74px}.metric small{display:block;color:#67818a;font-size:11px}.metric strong{font-size:20px;font-weight:500}.metric.note{margin-left:auto;max-width:300px;color:#65808a;font-size:12px}#plot{flex:1;min-height:320px}#detail{background:#fff;border-top:1px solid #dae4e6;padding:12px 24px;min-height:100px;font-size:12px}#detail b{font-weight:600}footer{padding:9px 24px;background:#f9fbfb;color:#65808a;font-size:11px}.panel-title{font-size:12px;color:#55727d;margin-bottom:6px}#status{font-size:12px;padding-top:15px;color:#577984}.error{color:#b14337!important}#patchInfo{font-size:12px;color:#57717a;margin:9px 0}.pill{padding:3px 6px;background:#eaf2f3;border-radius:4px;margin-right:6px;display:inline-block}a{color:#177687}.hidden{display:none}@media(max-width:950px){main{grid-template-columns:240px 1fr}aside{padding:13px}.metrics{gap:13px;padding:12px}.metric.note{display:none}}
</style><script>/*__PLOTLY__*/</script></head><body>
<header><div><h1>Hairpin · 曲线形状贡献</h1><div class="muted">FMT p35 / n0_k06 · 预测为 hairpin 的真实涡线束</div></div><span class="badge">逐点敏感度 + 局部形状干预</span></header>
<main><aside>
<label>流场<select id="flow"><option value="channel">Channel</option><option value="tbl">TBL</option><option value="all">Channel + TBL</option></select></label>
<label>与区域标签的关系<select id="agreement"><option value="all">全部预测 Hairpin</option><option value="tp">标签也是 Hairpin</option><option value="fp">标签为 Non-hairpin</option></select></label>
<label>展示方式<select id="layout"><option value="gallery">形状画廊 · 并排观察</option><option value="single">单束 · 详细观察</option><option value="physical">原始物理位置</option></select></label>
<div id="galleryControls"><label>每页束数<select id="pageSize"><option selected>8</option><option>16</option><option>32</option><option>64</option></select></label><div class="row"><button id="previousPage">上一页</button><button id="nextPage">下一页</button></div></div>
<label style="margin-top:13px">当前线束<select id="bundle"></select></label>
<div class="row"><button id="previousBundle">上一束</button><button id="nextBundle">下一束</button></div>
<div class="section"><label>着色依据<select id="map"><option value="local_shape_delta">局部弯曲对 Hairpin 的支持 / 抑制</option><option value="smooth_gradient">SmoothGrad · 平均梯度敏感度</option><option value="gradient">原始逐点梯度敏感度</option><option value="plain">原始几何 · 统一颜色</option></select></label>
<label>色标范围<select id="scale"><option value="common">全部 400 束共同色标</option><option value="individual">每束独立色标 · 只比束内分布</option></select></label>
<div id="legend" class="legend"></div><div class="ends"><span id="legendLeft">抑制 Hairpin</span><span id="legendRight">支持 Hairpin</span></div><div id="explanation"></div>
<label style="margin-top:14px">线宽 <span id="widthValue">4</span><input id="width" type="range" min="1" max="10" value="4"></label>
<label class="check"><input id="axes" type="checkbox">显示坐标轴</label>
<label>视角<select id="camera"><option value="oblique">斜视</option><option value="side">x-z 侧视</option><option value="top">x-y 俯视</option><option value="end">y-z 端视</option></select></label><button id="reset" class="wide">重置视角</button></div>
<div class="section"><div class="panel-title">局部形状干预 · 单束模式</div><label class="check"><input id="patch" type="checkbox">标出影响最大的片段与替代直线</label><label>选择干预片段<select id="patchSelect"></select></label><div id="patchInfo">选择单束后查看。</div><button id="showPatch" class="wide">聚焦当前线束与片段</button></div>
<div class="section"><a id="download" class="wide" download target="_blank" style="display:block;text-align:center;border:1px solid #cbdadd;border-radius:5px;padding:8px;text-decoration:none">下载当前束的坐标与贡献 JSON</a><button id="image" class="wide" style="margin-top:8px">保存当前视图 PNG</button><div id="status" role="status">正在加载…</div></div>
</aside><article><div class="metrics"><div class="metric"><small>本页 / 当前筛选</small><strong id="count">—</strong></div><div class="metric"><small>当前束 Hairpin 概率</small><strong id="probability">—</strong></div><div class="metric"><small>当前束 / 区域标签</small><strong id="label">—</strong></div><div class="metric note" id="viewNote"></div></div>
<div id="plot" aria-label="线束形状贡献三维可视化"></div><div id="detail"></div>
<footer>固定模型 seed 96611；展示样本来自原测试集。区域标签不是逐线或逐点标签。热图解释模型对输入几何的响应，不等同于物理涡核或人工头部标注。<a href="viewer_manifest.json" target="_blank">来源与复现记录</a></footer></article></main>
<script>
'use strict';
const DATA=/*__PAYLOAD__*/;
const $=id=>document.getElementById(id);
const records=DATA.records, byId=new Map(records.map(r=>[r.id,r]));
const cache=new Map(), pending=new Map();
window.registerSaliency=(id, data)=>{cache.set(id,data);if(pending.has(id)){pending.get(id).resolve(data);pending.delete(id);}};
const state={page:0,selected:records[0].id,render:0,patch:0,camera:null};
const diverging=[[0,'#2868bd'],[.25,'#88b4d7'],[.5,'#f2f1ea'],[.75,'#ed9470'],[1,'#b82f36']];
const sequential=[[0,'#d8e9eb'],[.2,'#78b4bd'],[.45,'#28878f'],[.7,'#eead54'],[1,'#bc2e36']];
function filtered(){return records.filter(r=>($('flow').value==='all'||r.flow===$('flow').value)&&($('agreement').value==='all'||r.label===($('agreement').value==='tp'?1:0)));}
function load(id){if(cache.has(id))return Promise.resolve(cache.get(id));if(pending.has(id))return pending.get(id).promise;let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b;});pending.set(id,{promise,resolve,reject});const script=document.createElement('script');script.src='data/'+id+'.js';script.onerror=()=>{pending.delete(id);script.remove();reject(new Error('无法加载 '+id));};document.head.appendChild(script);return promise;}
function updateChoices(){const rows=filtered();if(!rows.some(r=>r.id===state.selected))state.selected=rows[0]?.id??null;const select=$('bundle');select.replaceChildren();for(const r of rows){const o=document.createElement('option');o.value=r.id;o.textContent=`${r.flow} · #${r.row} · p=${r.probability.toFixed(3)} · ${r.label?'标签一致':'标签不一致'}`;select.appendChild(o);}select.value=state.selected;state.page=Math.min(state.page,Math.max(0,Math.ceil(rows.length/+$('pageSize').value)-1));}
function chosenRows(){const rows=filtered();if($('layout').value==='single')return rows.filter(r=>r.id===state.selected);const size=+$('pageSize').value;return rows.slice(state.page*size,(state.page+1)*size);}
function camera(){const eye={oblique:{x:1.1,y:-2.1,z:1.0},side:{x:0,y:-2.8,z:0},top:{x:0,y:0,z:2.8},end:{x:2.8,y:0,z:0}}[$('camera').value];if($('layout').value==='gallery'&&$('camera').value==='oblique'){eye.x=0;eye.y=-2.8;eye.z=0;}return state.camera||{eye,up:$('camera').value==='top'?{x:0,y:1,z:0}:{x:0,y:0,z:1},projection:{type:'orthographic'}};}
function colorLimit(r,key){if($('scale').value==='common')return DATA.color_limits[key]||1;return r.color_limits[key]||1;}
function mapText(){const m=$('map').value;const shape=m==='local_shape_delta',plain=m==='plain';$('legend').style.background=shape?'linear-gradient(90deg,#2868bd,#f2f1ea,#b82f36)':'linear-gradient(90deg,#d8e9eb,#28878f,#eead54,#bc2e36)';$('legend').style.opacity=plain?'0':'1';$('legendLeft').textContent=shape?'负值 · 抑制 Hairpin':'低敏感度';$('legendRight').textContent=shape?'正值 · 支持 Hairpin':'高敏感度';$('explanation').textContent=plain?'查看原始曲线几何。':shape?'把局部曲线替换为端点间直线，再计算分类分数的下降。红色表示原片段支持 Hairpin；蓝色表示抑制。重叠片段的内部点取平均；端点未改动。':'分类分数对点坐标变化的敏感度；暖色越强，微小几何扰动越可能影响判断。敏感度没有支持 / 反对的正负含义。';if(!plain)$('explanation').textContent+=' 色标在绝对值第 98 百分位截断，悬停可查原值。';}
function positions(r,d,index){let points=d.geometry;const mode=$('layout').value;if(mode==='gallery'){points=d.normalized_geometry;const columns=Math.min(4,chosenRows().length),cx=(index%columns)*3.2,cz=-Math.floor(index/columns)*3.2;return points.map(line=>line.map(p=>[p[0]+cx,p[1],p[2]+cz]));}return points;}
function trace(r,d,index){const points=positions(r,d,index),key=$('map').value,lim=colorLimit(r,key);const x=[],y=[],z=[],color=[],custom=[];for(let l=0;l<r.count;l++){for(let j=0;j<32;j++){const p=points[l][j];x.push(p[0]);y.push(p[1]);z.push(p[2]);const value=key==='plain'?0:d[key][l][j];color.push(value);custom.push([r.id,l,j,value,r.probability,d.local_shape_delta[l][j],d.gradient[l][j],d.smooth_gradient[l][j]]);}x.push(null);y.push(null);z.push(null);color.push(0);custom.push(null);}return {type:'scatter3d',mode:'lines',x,y,z,customdata:custom,name:r.id,showlegend:false,hovertemplate:'%{customdata[0]}<br>线 %{customdata[1]} · 点 %{customdata[2]}<br>着色原值 %{customdata[3]:.5g}<br>P(Hairpin) %{customdata[4]:.4f}<br>局部形状分数变化 %{customdata[5]:.5g}<extra></extra>',line:{width:+$('width').value,color:key==='plain'?'#29868e':color,colorscale:key==='local_shape_delta'?diverging:sequential,cmin:key==='local_shape_delta'?-lim:0,cmax:lim,showscale:index===0&&key!=='plain'&&($('scale').value==='common'||$('layout').value==='single'),colorbar:{title:{text:key==='local_shape_delta'?'Δ 分类分数':'梯度敏感度'},thickness:12,len:.6,tickfont:{size:10}}}};}
function patchTrace(r,d){const patch=d.patches[state.patch];if(!patch)return[];const [l,a,b]=patch.indices,points=d.geometry[l],original=points.slice(a,b+1),chord=[points[a],points[b]];return [{type:'scatter3d',mode:'lines+markers',x:original.map(p=>p[0]),y:original.map(p=>p[1]),z:original.map(p=>p[2]),name:'原始片段',hoverinfo:'name',line:{color:'#232934',width:8},marker:{size:2,color:'#232934'}},{type:'scatter3d',mode:'lines+markers',x:chord.map(p=>p[0]),y:chord.map(p=>p[1]),z:chord.map(p=>p[2]),name:'替代直线',hoverinfo:'name',line:{color:'#b455bb',width:6,dash:'dash'},marker:{size:4,color:'#b455bb'}}];}
function showDetail(r,d){if(!r){$('detail').textContent='当前筛选没有样本。';$('probability').textContent='—';$('label').textContent='—';$('patchInfo').textContent='当前筛选没有样本。';$('patchSelect').replaceChildren();$('download').removeAttribute('href');return;}$('download').href='data/'+r.id+'.json';$('download').download=r.id+'_saliency.json';$('probability').textContent=r.probability.toFixed(4);$('label').textContent=r.label?'Hairpin':'Non-hairpin';const ps=$('patchSelect'),current=ps.dataset.bundle;const ranked=d.patches.map((p,i)=>({p,i})).sort((a,b)=>Math.abs(b.p.margin_delta)-Math.abs(a.p.margin_delta));if(current!==r.id){ps.replaceChildren();for(const {p,i} of ranked){const o=document.createElement('option');o.value=i;o.textContent=`线 ${p.indices[0]} · 点 ${p.indices[1]}–${p.indices[2]} · Δ=${p.margin_delta.toFixed(3)}`;ps.appendChild(o);}state.patch=ranked[0].i;ps.dataset.bundle=r.id;}ps.value=state.patch;const p=d.patches[state.patch];$('patchInfo').textContent=`仅把线 ${p.indices[0]} 的点 ${p.indices[1]}–${p.indices[2]} 之间拉直后：P(Hairpin)=${p.probability.toFixed(4)}；分数变化=${p.margin_delta.toFixed(5)}。${p.margin_delta>0?'原片段支持 Hairpin。':'原片段抑制 Hairpin。'}`;$('detail').innerHTML=`<span class="pill">${r.flow} / test / #${r.row}</span><span class="pill">${r.count} 条线 × 32 点</span><span class="pill">区域实例 ${r.instance} · 尺度 ${r.scale_id}</span><br><b>${r.label?'预测与区域标签一致。':'预测为 Hairpin，区域标签为 Non-hairpin。'}</b> 点击任一线束可进入单束模式；悬停查看点的贡献。逐点着色不会把整条线统一赋色。<br><span class="muted">模型 seed 96611，原测试 F1=${DATA.model.seed_test_metrics.combined.f1.toFixed(6)}；0.888404 是三种子平均。画廊只是显示布局；单束和物理位置模式保持真实坐标比例。</span>`;}
async function render(){const token=++state.render;try{$('status').classList.remove('error');$('status').textContent='加载曲线与贡献…';updateChoices();mapText();const rows=chosenRows(),all=filtered(),mode=$('layout').value;const packs=await Promise.all(rows.map(r=>load(r.id)));if(token!==state.render)return;let selected=byId.get(state.selected),selectedData=selected?await load(selected.id):null;if(token!==state.render)return;showDetail(selected,selectedData);let traces=rows.map((r,i)=>trace(r,packs[i],i));if(mode==='gallery'&&rows.length){const columns=Math.min(4,rows.length);traces.push({type:'scatter3d',mode:'text',x:rows.map((r,i)=>(i%columns)*3.2),y:rows.map(()=>0),z:rows.map((r,i)=>-Math.floor(i/columns)*3.2+1.35),text:rows.map(r=>`${r.flow==='channel'?'Channel':'TBL'} #${r.row}`),customdata:rows.map(r=>[r.id]),hoverinfo:'skip',textfont:{size:11,color:'#375660'},showlegend:false});}if(mode==='single'&&$('patch').checked&&selected)traces.push(...patchTrace(selected,selectedData));const visible=$('axes').checked;const axis={visible,showgrid:visible,zeroline:false,showbackground:false};await Plotly.react('plot',traces,{paper_bgcolor:'#f3f5f5',margin:{l:0,r:5,t:0,b:0},showlegend:mode==='single'&&$('patch').checked,legend:{x:.01,y:.99,bgcolor:'#ffffffcc'},scene:{xaxis:{...axis,title:'x',...(mode==='gallery'?{range:[-1.6,(Math.min(4,rows.length)-1)*3.2+1.6]}:{})},yaxis:{...axis,title:'y',...(mode==='gallery'?{range:[-1.3,1.3]}:{})},zaxis:{...axis,title:'z',...(mode==='gallery'?{range:[-(Math.ceil(rows.length/4)-1)*3.2-1.4,1.8]}:{})},aspectmode:'data',camera:camera()},uirevision:mode+'-'+(mode==='single'?state.selected:state.page)}, {responsive:true,displaylogo:false,modeBarButtonsToRemove:['toImage']});if(token!==state.render)return;$('count').textContent=`${rows.length} / ${all.length}`;$('galleryControls').style.display=mode==='single'?'none':'block';$('previousPage').disabled=state.page===0;$('nextPage').disabled=(state.page+1)*+$('pageSize').value>=all.length;$('viewNote').textContent=mode==='gallery'?'画廊：每束归一化后分格摆放，便于比较形状；不代表原始空间位置。':mode==='single'?'单束：真实物理坐标，保持三个方向的比例。':$('flow').value==='all'?'两个流场的坐标系不同，请选择单一流场查看物理位置。':'真实物理位置；本页显示的线束。';$('status').textContent=`已加载 ${rows.length} 束 · 共 ${records.length} 个真实实例 · 无模型权重`;}catch(error){$('status').classList.add('error');$('status').textContent=error.message;console.error(error);}}
for(const id of ['flow','agreement'])$(id).addEventListener('change',()=>{state.page=0;state.camera=null;render();});
for(const id of ['map','scale','axes','width','patch'])$(id).addEventListener('change',()=>{if(id==='width')$('widthValue').textContent=$('width').value;render();});
$('layout').onchange=()=>{state.camera=null;render();};$('pageSize').onchange=()=>{state.page=0;render();};
$('bundle').onchange=()=>{state.selected=$('bundle').value;state.camera=null;$('layout').value='single';render();};
for(const [id,step] of [['previousPage',-1],['nextPage',1]])$(id).onclick=()=>{state.page+=step;state.camera=null;render();};
for(const [id,step] of [['previousBundle',-1],['nextBundle',1]])$(id).onclick=()=>{const rows=filtered(),i=rows.findIndex(r=>r.id===state.selected);state.selected=rows[(i+step+rows.length)%rows.length]?.id;$('layout').value='single';state.camera=null;render();};
$('camera').onchange=()=>{state.camera=null;render();};$('reset').onclick=()=>{state.camera=null;render();};
$('patchSelect').onchange=()=>{state.patch=+$('patchSelect').value;$('patch').checked=true;$('layout').value='single';render();};
$('showPatch').onclick=()=>{$('layout').value='single';$('patch').checked=true;state.camera=null;render();};
$('image').onclick=()=>Plotly.downloadImage('plot',{format:'png',width:1800,height:1300,filename:'hairpin_saliency_'+state.selected});
render().then(()=>{$('plot').on('plotly_click',event=>{const id=event.points[0]?.customdata?.[0];if(!byId.has(id))return;state.selected=id;$('layout').value='single';state.camera=null;render();});$('plot').on('plotly_relayout',event=>{if(event['scene.camera'])state.camera=event['scene.camera'];});});
</script></body></html>
