experiment: Verify_Task3_AuxiliaryDeepSupervision_26.1
output_root: outputs/Verify_Task3_AuxiliaryDeepSupervision_26.1
task: Task3

# Development-only direct supervision of the projected auxiliary branch.
# The completed 11.1 selector supplies the strongest high-absolute-FMT
# optimizer/network recipe and the completed 22.1 selector supplies the
# family-specific anchored feature.  No confirmation population is opened.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

combination_sources:
  core:
    kind: optimization
    selection: outputs/Verify_Task3_CombinedOptimization_11.1/optimization_selection.json
    expected_experiment: Verify_Task3_CombinedOptimization_11.1
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# One exact control plus a 2 x 5 grid.  The auxiliary classifier is used only
# by the training loss; inference remains frozen-Raw + residual.  FMT and
# train-only Raw-PCA use the same classifier architecture, loss weight,
# projection, batches, labels, optimizer, training budget, and paired seed.
optimization_candidates:
  - id: a00_control
    sources: [core, feature]
  - id: a01_linear_w001
    sources: [core, feature]
    model: {auxiliary_classifier_architecture: linear}
    training: {auxiliary_supervision_loss_weight: 0.01}
