experiment: Verify_Task123_NoiseTypes_1.1
status: preregistered_clean_train_corrupted_confirmation_noise_type_sweep
output_root: outputs/Verify_Task123_NoiseTypes_1.1
# Preregistered sweep over noise TYPES (not only levels) for the FMT and
# original Raw arms; the stronger baselines run on the identical realizations
# in Verify_Task123_NoiseTypesStrong_1.1.  All 22 corrupted conditions are
# reported regardless of outcome.  Levels: gaussian/gaussian_smooth/
# common_mode/line_offset are standard deviations in units of the neighbour
# offset distance; rigid_rotation is an angle in degrees about a random axis
# through the seed point; impulse is the fraction of displaced samples (jump
# std = 1.0 offset); time_warp is the relative deviation of the sample spacing
# from uniform.  Training, normalization, PCA, KMeans centers, cluster-name
# calibration, epoch selection, fusion alpha and thresholds are fitted on
# clean data only; corruption is applied to confirmation pathlines only.
corruptions:
  - {id: clean, kind: clean, level: 0.0}
  - {id: gaussian_0005, kind: gaussian, level: 0.005}
  - {id: gaussian_001, kind: gaussian, level: 0.01}
  - {id: gaussian_002, kind: gaussian, level: 0.02}
  - {id: gaussian_003, kind: gaussian, level: 0.03}
  - {id: gaussian_smooth_005, kind: gaussian_smooth, level: 0.05}
  - {id: gaussian_smooth_010, kind: gaussian_smooth, level: 0.10}
  - {id: gaussian_smooth_020, kind: gaussian_smooth, level: 0.20}
  - {id: common_mode_005, kind: common_mode, level: 0.05}
  - {id: common_mode_010, kind: common_mode, level: 0.10}
  - {id: common_mode_020, kind: common_mode, level: 0.20}
  - {id: line_offset_005, kind: line_offset, level: 0.05}
  - {id: line_offset_010, kind: line_offset, level: 0.10}
  - {id: line_offset_020, kind: line_offset, level: 0.20}
  - {id: rigid_rotation_015, kind: rigid_rotation, level: 15.0}
  - {id: rigid_rotation_045, kind: rigid_rotation, level: 45.0}
  - {id: rigid_rotation_090, kind: rigid_rotation, level: 90.0}
  - {id: impulse_002, kind: impulse, level: 0.02}
  - {id: impulse_005, kind: impulse, level: 0.05}
  - {id: impulse_010, kind: impulse, level: 0.10}
  - {id: time_warp_010, kind: time_warp, level: 0.10}
  - {id: time_warp_025, kind: time_warp, level: 0.25}
  - {id: time_warp_050, kind: time_warp, level: 0.50}

