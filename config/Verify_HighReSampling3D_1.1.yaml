experiment: Verify_HighReSampling3D_1.1
source_config: config/Verify_Task2Universality_1.1.yaml
datasets: [halfcylinderRe640, halfcylinderRe6400]
fixed_time_indices:
  halfcylinderRe640: [16, 21, 26, 31, 36, 42, 47, 52, 57, 62]
  halfcylinderRe6400: [31, 42, 54, 65, 77, 88, 100, 111, 123, 134]
representations: [positions, pair_distance, fmt]

# Stage A holds field/seed density at the frozen baseline and isolates temporal
# horizon, integration step, and an anisotropy-aware isotropic neighbor radius.
variants:
  - {id: short_min, dt_scale: 0.25, integration_steps: 32, sampled_steps: 32,
     offset_mode: min, offset_grid_scale: 0.5, max_spatial_dim: 96,
     seed_grid_shape: [16, 16, 16]}
  - {id: fine8_min, dt_scale: 0.125, integration_steps: 64, sampled_steps: 32,
     offset_mode: min, offset_grid_scale: 0.5, max_spatial_dim: 96,
     seed_grid_shape: [16, 16, 16]}
  - {id: fine8_geom05, dt_scale: 0.125, integration_steps: 64, sampled_steps: 32,
     offset_mode: geometric_mean, offset_grid_scale: 0.5, max_spatial_dim: 96,
     seed_grid_shape: [16, 16, 16]}
  - {id: fine8_geom1, dt_scale: 0.125, integration_steps: 64, sampled_steps: 32,
     offset_mode: geometric_mean, offset_grid_scale: 1.0, max_spatial_dim: 96,
     seed_grid_shape: [16, 16, 16]}
  - {id: fine8_max05, dt_scale: 0.125, integration_steps: 64, sampled_steps: 32,
     offset_mode: max, offset_grid_scale: 0.5, max_spatial_dim: 96,
     seed_grid_shape: [16, 16, 16]}
  - {id: fine4_geom05, dt_scale: 0.125, integration_steps: 32, sampled_steps: 32,
     offset_mode: geometric_mean, offset_grid_scale: 0.5, max_spatial_dim: 96,
     seed_grid_shape: [16, 16, 16]}
  - {id: fine6_geom05, dt_scale: 0.125, integration_steps: 48, sampled_steps: 32,
     offset_mode: geometric_mean, offset_grid_scale: 0.5, max_spatial_dim: 96,
     seed_grid_shape: [16, 16, 16]}

output_dir: outputs/Verify_HighReSampling3D_1.1
