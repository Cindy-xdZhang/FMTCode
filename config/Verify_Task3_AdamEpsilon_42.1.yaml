experiment: Verify_Task3_AdamEpsilon_42.1
output_root: outputs/Verify_Task3_AdamEpsilon_42.1
task: Task3

# Adaptive development search declared without reading partial metrics from
# 35.1--41.1. It changes only AdamW denominator epsilon. Raw-PCA and FMT use
# the same epsilon within every candidate.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# null is the exact PyTorch-default control (AdamW eps=1e-8 without override).
optimization_candidates:
  - {id: q00_control_default, sources: [feature],
     training: {optimizer_epsilon: null}}
  - {id: q01_eps1e12, sources: [feature],
     training: {optimizer_epsilon: 1.0e-12}}
  - {id: q02_eps1e10, sources: [feature],
     training: {optimizer_epsilon: 1.0e-10}}
  - {id: q03_eps1e9, sources: [feature],
     training: {optimizer_epsilon: 1.0e-9}}
  - {id: q04_eps1e7, sources: [feature],
     training: {optimizer_epsilon: 1.0e-7}}
  - {id: q05_eps1e6, sources: [feature],
     training: {optimizer_epsilon: 1.0e-6}}
  - {id: q06_eps1e5, sources: [feature],
     training: {optimizer_epsilon: 1.0e-5}}
  - {id: q07_eps1e4, sources: [feature],
     training: {optimizer_epsilon: 1.0e-4}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: q00_control_default
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
