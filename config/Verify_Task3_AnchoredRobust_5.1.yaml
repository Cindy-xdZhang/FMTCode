experiment: Verify_Task3_AnchoredRobust_5.1
output_root: outputs/Verify_Task3_AnchoredRobust_5.1
expected_slices: 10
sampled_steps: 32
raw_pca_random_state: 7068
raw_wide_parameter_count: 148225
datasets: [channel, cylinder3d, halfcylinderRe640, halfcylinderRe6400,
           tangaroa, deltaWing_resampled, deltaWing_LBM, f22raptor,
           boeing747, smokeBuoyancy]

# The spatial roots were the final confirmation population of 4.1.  Since
# those results are now public, 5.1 treats them only as development data.
# They may select 5.1 candidates, but no 5.1 final claim may use them.
robust_validation:
  status: exposed_development
  source_experiment: mainExp_Task3_3D_4.1
  seed_grid_phase: [0.31, -0.23, 0.17]
  expected_slices: 4
  ordinals: [0, 1, 2, 3]

