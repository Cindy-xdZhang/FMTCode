experiment: Verify_Task3_ParameterEMA_40.1
output_root: outputs/Verify_Task3_ParameterEMA_40.1
task: Task3

# Adaptive development search declared after the complete 33.1 result and
# without reading partial metrics from 34.1--39.1. It changes only whether
# trainable residual-head parameters are evaluated through an exponential
# moving average (EMA). Raw-PCA and FMT use the same decay in every candidate.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# null is the exact historical control. Positive values update the EMA after
# every optimizer step and use EMA parameters for validation/checkpointing.
optimization_candidates:
  - {id: e00_control_none, sources: [feature],
     training: {parameter_ema_decay: null}}
  - {id: e01_decay0500, sources: [feature],
     training: {parameter_ema_decay: 0.5}}
  - {id: e02_decay0800, sources: [feature],
     training: {parameter_ema_decay: 0.8}}
  - {id: e03_decay0900, sources: [feature],
     training: {parameter_ema_decay: 0.9}}
  - {id: e04_decay0950, sources: [feature],
     training: {parameter_ema_decay: 0.95}}
  - {id: e05_decay0980, sources: [feature],
     training: {parameter_ema_decay: 0.98}}
  - {id: e06_decay0990, sources: [feature],
     training: {parameter_ema_decay: 0.99}}
  - {id: e07_decay0995, sources: [feature],
     training: {parameter_ema_decay: 0.995}}
  - {id: e08_decay0999, sources: [feature],
     training: {parameter_ema_decay: 0.999}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: e00_control_none
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
