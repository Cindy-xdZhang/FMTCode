experiment: Verify_Task3_ConfidenceGatedResidual_23.1
output_root: outputs/Verify_Task3_ConfidenceGatedResidual_23.1
task: Task3

base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

# Freeze the complete family-specific 11.1 winner before applying the same
# label-free Raw-confidence gate to FMT and train-only Raw-PCA.
combination_sources:
  core:
    selection: outputs/Verify_Task3_CombinedOptimization_11.1/optimization_selection.json
    expected_experiment: Verify_Task3_CombinedOptimization_11.1

# Gate definition:
#   p = sigmoid(raw_logit / temperature)
#   uncertainty = 4 * p * (1 - p)
#   gate = floor + (1 - floor) * uncertainty
#   combined_logit = raw_logit + alpha * gate * residual_logit
# The 3 x 4 factorial is declared before any 23.1 result exists.  The exact
# no-gate 11.1 reproduction is retained as the control.
optimization_candidates:
  - id: g00_control
    sources: [core]
    model:
      residual_gate: none
      residual_gate_temperature: 1.0
      residual_gate_floor: 0.0
  - {id: g01_t05_f000, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 0.5, residual_gate_floor: 0.00}}
  - {id: g02_t10_f000, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 1.0, residual_gate_floor: 0.00}}
  - {id: g03_t20_f000, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 2.0, residual_gate_floor: 0.00}}
  - {id: g04_t05_f025, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 0.5, residual_gate_floor: 0.25}}
  - {id: g05_t10_f025, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 1.0, residual_gate_floor: 0.25}}
  - {id: g06_t20_f025, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 2.0, residual_gate_floor: 0.25}}
  - {id: g07_t05_f050, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 0.5, residual_gate_floor: 0.50}}
  - {id: g08_t10_f050, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 1.0, residual_gate_floor: 0.50}}
  - {id: g09_t20_f050, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 2.0, residual_gate_floor: 0.50}}
  - {id: g10_t05_f075, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 0.5, residual_gate_floor: 0.75}}
  - {id: g11_t10_f075, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 1.0, residual_gate_floor: 0.75}}
  - {id: g12_t20_f075, sources: [core], model: {residual_gate: raw_uncertainty, residual_gate_temperature: 2.0, residual_gate_floor: 0.75}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_f1
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: g00_control
    f1_tolerance: 0.002
    average_precision_tolerance: 0.002
  target_dataset_macro_f1_gain: 0.16
  target_absolute_fmt_f1: 0.887
  confirmation_opened: false
