experiment: Verify_Task3_AuxiliaryGradientClip_77.1
output_root: outputs/Verify_Task3_AuxiliaryGradientClip_77.1
task: Task3

# Development-only single-factor search frozen before 75.1 produces any
# performance result. The independently audited 76.1 portfolio supplies one
# complete recipe per physical family. Candidates change only a post-global,
# projection-only gradient-norm cap; the frozen Raw backbone and downstream
# residual head are untouched.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  portfolio:
    kind: optimization
    selection: outputs/Verify_Task3_AuxiliaryPostNormPortfolio_76.1/portfolio_selection.json
    expected_experiment: Verify_Task3_AuxiliaryPostNormPortfolio_76.1

# c00 is an exact no-op control. When a source recipe already has global
# gradient clipping, that historical whole-model clip runs first; the new cap
# then acts only on fmt_encoder parameters. The same cap is applied to FMT and
# same-width train-only Raw-PCA arms.
optimization_candidates:
  - {id: g00_control_none, sources: [portfolio]}
  - {id: g01_auxclip001, sources: [portfolio], training: {auxiliary_gradient_clip_norm: 0.01}}
  - {id: g02_auxclip003, sources: [portfolio], training: {auxiliary_gradient_clip_norm: 0.03}}
  - {id: g03_auxclip010, sources: [portfolio], training: {auxiliary_gradient_clip_norm: 0.10}}
  - {id: g04_auxclip030, sources: [portfolio], training: {auxiliary_gradient_clip_norm: 0.30}}
  - {id: g05_auxclip100, sources: [portfolio], training: {auxiliary_gradient_clip_norm: 1.00}}
  - {id: g06_auxclip300, sources: [portfolio], training: {auxiliary_gradient_clip_norm: 3.00}}
  - {id: g07_auxclip1000, sources: [portfolio], training: {auxiliary_gradient_clip_norm: 10.0}}
  - {id: g08_auxclip3000, sources: [portfolio], training: {auxiliary_gradient_clip_norm: 30.0}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: g00_control_none
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.218
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
