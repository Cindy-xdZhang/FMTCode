    expected_experiment: Verify_Task3_BatchSize_36.1
  positive_weight:
    selection: outputs/Verify_Task3_PositiveWeightScale_37.1/optimization_selection.json
    expected_experiment: Verify_Task3_PositiveWeightScale_37.1
  dropout:
