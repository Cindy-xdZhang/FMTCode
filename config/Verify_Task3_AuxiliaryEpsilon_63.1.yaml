experiment: Verify_Task3_AuxiliaryEpsilon_63.1
output_root: outputs/Verify_Task3_AuxiliaryEpsilon_63.1
task: Task3

# Development-only sequential optimizer search. The independently audited
# 62.1 portfolio supplies one frozen recipe per physical family. Only Adam's
# denominator epsilon for the trainable auxiliary projection changes; the
# downstream residual head retains the source recipe's optimizer epsilon.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  portfolio:
    kind: optimization
    selection: outputs/Verify_Task3_AuxiliaryBeta1Portfolio_62.1/portfolio_selection.json
    expected_experiment: Verify_Task3_AuxiliaryBeta1Portfolio_62.1

# c00 exactly reproduces the source recipe. Other cells replace only the
# auxiliary projection's epsilon and inherit all downstream optimizer values.
optimization_candidates:
  - {id: c00_control_auxeps, sources: [portfolio]}
  - {id: c01_auxeps1e12, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-12}}
  - {id: c02_auxeps1e10, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-10}}
  - {id: c03_auxeps1e9, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-9}}
  - {id: c04_auxeps1e8, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-8}}
  - {id: c05_auxeps1e7, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-7}}
  - {id: c06_auxeps1e6, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-6}}
  - {id: c07_auxeps1e5, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-5}}
  - {id: c08_auxeps1e4, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-4}}
  - {id: c09_auxeps1e3, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-3}}
  - {id: c10_auxeps1e2, sources: [portfolio], training: {auxiliary_optimizer_epsilon: 1.0e-2}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: c00_control_auxeps
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.210
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
