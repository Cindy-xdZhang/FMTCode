experiment: Verify_Task3_SafeFactorCombination_44.1
output_root: outputs/Verify_Task3_SafeFactorCombination_44.1
task: Task3

# Adaptive development combination declared after the complete negative 35.1
# result and before reading any 36.1--43.1 metric. Every optimization source
# must be a completed, confirmation-closed selector. Preflight freezes source
# SHA-256 values and family-specific winner IDs before any 44.1 training.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
