experiment: Verify_Task3_SemanticBlockProjection_25.1
output_root: outputs/Verify_Task3_SemanticBlockProjection_25.1
task: Task3

# Development-only 2x4 factorial.  The frozen 11.1 family recipe supplies the
# strongest high-absolute-FMT training protocol; the completed 22.1 selector
# supplies its family-specific feature decomposition.  No partial selector or
# confirmation population is read.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

combination_sources:
  core:
    kind: optimization
    selection: outputs/Verify_Task3_CombinedOptimization_11.1/optimization_selection.json
    expected_experiment: Verify_Task3_CombinedOptimization_11.1
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# Factor 1: frozen 5.2 feature versus the complete 22.1 family winner.
# Factor 2: historical dense projection versus three semantic-block branches.
# For blockwise candidates, the implementation derives and freezes contiguous
# block widths from the final feature name.  Raw-PCA uses exactly the same
# widths, branches, output width, optimizer, loss, and seed as FMT.
optimization_candidates:
  - id: s00_control
    sources: [core]
  - id: s01_old_blocklinear
    sources: [core]
    model: {auxiliary_projection: blockwise_linear_gelu}
  - id: s02_old_blockrms
    sources: [core]
    model: {auxiliary_projection: blockwise_rmsnorm_gelu}
  - id: s03_old_blockmlp
    sources: [core]
    model: {auxiliary_projection: blockwise_mlp_gelu,
            auxiliary_hidden_dim: 16}
  - id: s04_feature_dense
    sources: [core, feature]
  - id: s05_feature_blocklinear
    sources: [core, feature]
    model: {auxiliary_projection: blockwise_linear_gelu}
  - id: s06_feature_blockrms
    sources: [core, feature]
    model: {auxiliary_projection: blockwise_rmsnorm_gelu}
  - id: s07_feature_blockmlp
    sources: [core, feature]
    model: {auxiliary_projection: blockwise_mlp_gelu,
            auxiliary_hidden_dim: 16}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_f1
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: s00_control
    f1_tolerance: 0.002
    average_precision_tolerance: 0.002
  target_dataset_macro_f1_gain: 0.16
  target_absolute_fmt_f1: 0.89
  confirmation_opened: false
