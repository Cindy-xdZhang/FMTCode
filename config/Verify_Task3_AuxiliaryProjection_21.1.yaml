    model: {auxiliary_projection: linear_layernorm_gelu, auxiliary_hidden_dim: 64}
  - id: p01_linear
    sources: [ultranarrow]
    model: {auxiliary_projection: linear, auxiliary_hidden_dim: 64}
  - id: p02_linear_gelu
    sources: [ultranarrow]
    model: {auxiliary_projection: linear_gelu, auxiliary_hidden_dim: 64}
  - id: p03_linear_silu
    sources: [ultranarrow]
    model: {auxiliary_projection: linear_silu, auxiliary_hidden_dim: 64}
  - id: p04_linear_rmsnorm_gelu
    sources: [ultranarrow]
    model: {auxiliary_projection: linear_rmsnorm_gelu, auxiliary_hidden_dim: 64}
  - id: p05_mlp_layernorm_gelu
