experiment: mainExp_Task123NewFlows_1.1_development_cache
seed: 7068

datasets:
  - {id: boeing747, path: "C:/Users/xingdi/OneDrive - KAUST/WorkingInProcess/FLowVisAssets/flowData3D/LBM_3D/boeing747_808_2392.nc", enabled: true}
  - {id: smokeBuoyancy, path: "C:/Users/xingdi/OneDrive - KAUST/WorkingInProcess/FLowVisAssets/flowData3D/SmokeBuoyancy80_239.nc", enabled: true}

sampling:
