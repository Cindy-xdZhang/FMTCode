# Baseline-only companion to exp_Task1_OctVAE_3D_1.1: no VAE training.
# raw_pca16 is dimension-matched to z_inv; fmt_pca8 is the exact frozen
# published unified Task1 recipe (fmt_all+kin4 -> PCA8).
experiment: exp_Task1_OctVAE_3D_1.1_extra_baselines
group: oh
device: cpu
sampled_steps: 32
splits:
  vae_train:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  vae_validation:
  - 6
  - 7
  kmeans_train:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  cluster_calibration:
  - 8
  - 9
train_seeds: []
kmeans_seeds:
- 7068
- 7069
- 7070
- 7071
- 7072
kmeans_n_init: 20
encode_batch_size: 4096
readouts:
- plain
- gmean
- gmax
- gmeanmax
model:
  z_inv_dim: 16
  z_eq_dim: 12
  dec_hidden: 128
  dec_layers: 4
  w0: 30.0
  w0_first: 30.0
training:
  steps: 28000
  batch_size: 256
  lr: 0.0005
  encoder_lr_scale: 0.1
  weight_decay: 0.0001
  beta: 0.0001
  lambda_contrast: 15.0
  zinv_var_weight: 5.0
  zinv_cov_weight: 0.2
  zinv_target_std: 0.5
  clip_sigma: 5.0
  recon_channel_balance: true
  eval_every: 250
  selection_warmup: 2800
  selection_subsample: 8192
  kmeans_n_init: 10
  decoder_finetune_steps: 4000
  decoder_finetune_lr: 0.0005
datasets:
- id: halfcylinderRe160_eth
  family: halfcylinder
  label: Half-cylinder Re160
  development_cache: outputs/exp_Task1_ReSweep_0.1/development_cache/halfcylinderRe160_eth
  confirmation_cache: outputs/exp_Task1_ReSweep_0.1/confirmation_cache/halfcylinderRe160_eth
  published:
    fmt_f1: 0.5958
    raw_f1: 0.3834
    gain: 0.2125
    ari: 0.482
    nmi: 0.3182
  prior_run:
    fmt_f1: 0.522489
    raw_f1: 0.218807
    ari: 0.395565
  baselines:
  - name: raw_pca16
    feature: raw
    pca_dim: 16
  - name: fmt_pca8
    feature: fmt_all+kin4
    pca_dim: 8
  - name: fmt_family
    feature: fmt_all+kin4
    pca_dim: null
- id: halfcylinderRe640_eth
  family: halfcylinder
