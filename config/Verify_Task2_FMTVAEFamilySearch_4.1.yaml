  - {id: s128_l16_b1e-6, hidden_dims: [128, 64], latent_dim: 16,
     beta: 0.000001, learning_rate: 0.001, optimizer_steps: 4600,
     relational_weight: 0.0, pair_count: 2048}
  - {id: m256_l16_b1e-6, hidden_dims: [256, 128], latent_dim: 16,
     beta: 0.000001, learning_rate: 0.001, optimizer_steps: 4600,
     relational_weight: 0.0, pair_count: 2048}
  - {id: m256_l16_lr3e-4, hidden_dims: [256, 128], latent_dim: 16,
     beta: 0.000001, learning_rate: 0.0003, optimizer_steps: 7000,
     relational_weight: 0.0, pair_count: 2048}
  - {id: m256_l32_lr3e-4, hidden_dims: [256, 128], latent_dim: 32,
