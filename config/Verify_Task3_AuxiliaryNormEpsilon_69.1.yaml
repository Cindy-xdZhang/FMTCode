experiment: Verify_Task3_AuxiliaryNormEpsilon_69.1
output_root: outputs/Verify_Task3_AuxiliaryNormEpsilon_69.1
task: Task3

# Development-only single-factor normalization search.  The independently
# audited 68.1 portfolio supplies one frozen recipe per physical family.  The
# exact control preserves each normalizer's native epsilon; candidate cells
# change only the denominator epsilon inside the auxiliary projection.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  portfolio:
    kind: optimization
    selection: outputs/Verify_Task3_AuxiliaryNormBiasPortfolio_68.1/portfolio_selection.json
    expected_experiment: Verify_Task3_AuxiliaryNormBiasPortfolio_68.1

# c00 exactly reproduces the source recipe and therefore preserves native
# LayerNorm/RMSNorm epsilon.  Other cells set one explicit shared epsilon.
optimization_candidates:
  - {id: c00_control_normeps, sources: [portfolio]}
  - {id: c01_normeps_1em12, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-12}}
  - {id: c02_normeps_1em10, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-10}}
  - {id: c03_normeps_1em08, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-8}}
  - {id: c04_normeps_1em07, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-7}}
  - {id: c05_normeps_1em06, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-6}}
  - {id: c06_normeps_1em05, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-5}}
  - {id: c07_normeps_1em04, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-4}}
  - {id: c08_normeps_1em03, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-3}}
  - {id: c09_normeps_1em02, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-2}}
  - {id: c10_normeps_1em01, sources: [portfolio], model: {auxiliary_normalization_epsilon: 1.0e-1}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
