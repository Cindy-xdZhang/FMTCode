experiment: Verify_Task2_LatentBottleneck_5.1
output_root: outputs/Verify_Task2_LatentBottleneck_5.1
expected_slices: 10
confirmation_opened: false

source:
  repo_root_env: TASK2_SOURCE_ROOT
  repo_root: .
  family_search_config: config/Verify_Task2_FMTVAEFamilySearch_4.1.yaml
  stage2_selection: outputs/Verify_Task2_FMTVAEFamilySearch_4.1/stage2_selection.json
  stage2_selection_sha256: 439d9e5dcf72adc78d12c38dda55443d87ffed2b8aeb061067b3cda8a8d97795

splits:
  selection_train: [0, 1, 2, 3, 4, 5]
  selection_validation: [6, 7]
  forbidden: [8, 9]

# Only latent_dim changes.  Each group's FMT block, hidden layers, beta,
# optimizer and training budget are frozen from Task2 family search 4.1.
latent_dims: [1, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64]

groups:
  channel:
    datasets: [channel]
    development_cache: outputs/Verify_Task2Universality_1.1/cache
    source_config: config/Verify_Task2Universality_1.1.yaml
    fmt_feature: fmt_all+kin4
    source_architecture_id: s128_l8_b1e-6
    base_vae: {hidden_dims: [128, 64], control_latent_dim: 8,
               beta: 0.000001, learning_rate: 0.001,
               optimizer_steps: 4600, relational_weight: 0.0,
               pair_count: 2048}
  halfcylinder:
    datasets: [cylinder3d, halfcylinderRe640, halfcylinderRe6400]
    development_cache: outputs/Verify_Task2Universality_1.1/cache
    source_config: config/Verify_Task2Universality_1.1.yaml
    fmt_feature: fmt_all+kin4
    source_architecture_id: l512_l64_b1e-6
    base_vae: {hidden_dims: [512, 256], control_latent_dim: 64,
               beta: 0.000001, learning_rate: 0.0003,
               optimizer_steps: 7000, relational_weight: 0.0,
               pair_count: 2048}
  tangaroa:
