# Development-only projection search. It starts only after the complete 20.1
# selector freezes one auxiliary width per physical family. Every projection
# is then applied identically to FMT and train-only Raw-PCA.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
