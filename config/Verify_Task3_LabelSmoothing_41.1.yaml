experiment: Verify_Task3_LabelSmoothing_41.1
output_root: outputs/Verify_Task3_LabelSmoothing_41.1
task: Task3

# Adaptive development search declared after complete 34.1 and without reading
# partial metrics from 35.1--40.1. It changes only binary label smoothing in
# the training loss. Validation labels, IVD targets, and evaluation are fixed.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# Zero is the exact historical hard-label control. Smoothing epsilon maps a
# training target y to (1-epsilon)*y + epsilon/2.
optimization_candidates:
  - {id: s00_control_zero, sources: [feature],
     training: {label_smoothing: 0.0}}
  - {id: s01_eps0001, sources: [feature],
     training: {label_smoothing: 0.001}}
  - {id: s02_eps00025, sources: [feature],
     training: {label_smoothing: 0.0025}}
  - {id: s03_eps0005, sources: [feature],
     training: {label_smoothing: 0.005}}
  - {id: s04_eps001, sources: [feature],
     training: {label_smoothing: 0.01}}
  - {id: s05_eps002, sources: [feature],
     training: {label_smoothing: 0.02}}
  - {id: s06_eps005, sources: [feature],
     training: {label_smoothing: 0.05}}
  - {id: s07_eps010, sources: [feature],
     training: {label_smoothing: 0.10}}
  - {id: s08_eps020, sources: [feature],
     training: {label_smoothing: 0.20}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: s00_control_zero
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
