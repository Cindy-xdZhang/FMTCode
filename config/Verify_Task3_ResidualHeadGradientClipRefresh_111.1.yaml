experiment: Verify_Task3_ResidualHeadGradientClipRefresh_111.1
output_root: outputs/Verify_Task3_ResidualHeadGradientClipRefresh_111.1
task: Task3

# Frozen while 77.1 remains incomplete and before 109.1 can produce any
# performance metric. The independently audited 110.1 portfolio supplies one
# complete recipe per physical family. The exact source is the control; the
# remaining cells add only a downstream residual-head gradient-norm cap.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  portfolio:
    kind: optimization
    selection: outputs/Verify_Task3_ResidualHeadEpsilonRefreshPortfolio_110.1/portfolio_selection.json
    expected_experiment: Verify_Task3_ResidualHeadEpsilonRefreshPortfolio_110.1

allowed_source_overrides: [training.residual_head_gradient_clip_norm]

# h00 preserves the complete 110.1 source recipe. If that recipe already has
# global clipping, it runs first. The candidate cap then touches only trainable
# parameters outside fmt_encoder; the source auxiliary-only cap is unchanged.
optimization_candidates:
  - {id: h00_control_source, sources: [portfolio]}
  - {id: h01_headclip001, sources: [portfolio], training: {residual_head_gradient_clip_norm: 0.01}}
  - {id: h02_headclip003, sources: [portfolio], training: {residual_head_gradient_clip_norm: 0.03}}
  - {id: h03_headclip010, sources: [portfolio], training: {residual_head_gradient_clip_norm: 0.10}}
  - {id: h04_headclip030, sources: [portfolio], training: {residual_head_gradient_clip_norm: 0.30}}
  - {id: h05_headclip100, sources: [portfolio], training: {residual_head_gradient_clip_norm: 1.00}}
  - {id: h06_headclip300, sources: [portfolio], training: {residual_head_gradient_clip_norm: 3.00}}
  - {id: h07_headclip1000, sources: [portfolio], training: {residual_head_gradient_clip_norm: 10.0}}
  - {id: h08_headclip3000, sources: [portfolio], training: {residual_head_gradient_clip_norm: 30.0}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: h00_control_source
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.250
  target_absolute_fmt_f1: 0.908
  confirmation_opened: false
