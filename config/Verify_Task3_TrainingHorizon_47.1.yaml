experiment: Verify_Task3_TrainingHorizon_47.1
output_root: outputs/Verify_Task3_TrainingHorizon_47.1
task: Task3

# Development-only paired search. It changes only the common number of
# training epochs. Raw-PCA and FMT receive the same epoch budget in every cell.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# The control omits a training override and therefore executes the historical
# 100-epoch recipe exactly. The remaining cells span under- and over-training
# around that anchor without changing the optimizer, learning rate, loss,
# network, features, split, initialization, or decision protocol.
optimization_candidates:
  - {id: h00_control_epochs100, sources: [feature]}
  - {id: h01_epochs020, sources: [feature], training: {max_epochs: 20}}
  - {id: h02_epochs040, sources: [feature], training: {max_epochs: 40}}
  - {id: h03_epochs060, sources: [feature], training: {max_epochs: 60}}
  - {id: h04_epochs080, sources: [feature], training: {max_epochs: 80}}
  - {id: h05_epochs125, sources: [feature], training: {max_epochs: 125}}
  - {id: h06_epochs150, sources: [feature], training: {max_epochs: 150}}
  - {id: h07_epochs200, sources: [feature], training: {max_epochs: 200}}
  - {id: h08_epochs300, sources: [feature], training: {max_epochs: 300}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: h00_control_epochs100
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
