experiment: Verify_Task3_GradientClipping_33.1
output_root: outputs/Verify_Task3_GradientClipping_33.1
task: Task3

# Adaptive development search declared without reading partial performance from
# 27.1--32.1. It changes only global gradient-norm clipping. Raw-PCA and FMT
# receive the same clipping threshold within every candidate.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# null is the exact historical control. Positive values are global L2-norm
# limits applied after the finite-gradient check and before optimizer.step().
optimization_candidates:
  - {id: g00_control_none, sources: [feature],
     training: {gradient_clip_norm: null}}
  - {id: g01_norm01, sources: [feature],
     training: {gradient_clip_norm: 0.1}}
  - {id: g02_norm025, sources: [feature],
     training: {gradient_clip_norm: 0.25}}
  - {id: g03_norm05, sources: [feature],
     training: {gradient_clip_norm: 0.5}}
  - {id: g04_norm1, sources: [feature],
     training: {gradient_clip_norm: 1.0}}
  - {id: g05_norm2, sources: [feature],
     training: {gradient_clip_norm: 2.0}}
  - {id: g06_norm5, sources: [feature],
     training: {gradient_clip_norm: 5.0}}
  - {id: g07_norm10, sources: [feature],
     training: {gradient_clip_norm: 10.0}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: g00_control_none
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
