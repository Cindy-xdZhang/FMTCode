experiment: Verify_Task3_ClassBalancedBatches_13.1
output_root: outputs/Verify_Task3_ClassBalancedBatches_13.1
task: Task3

# Orthogonal development-only search around the frozen 5.2 family recipes and
# 6.1 deep-MLP winner.  Every sampler reads training labels only.  Validation,
# confirmation, and all earlier selectors remain unopened by this experiment.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

# Balanced candidates draw ceil(N/batch_size) full batches per epoch.  The
# positive-class BCE weight is changed from n_negative/n_positive to
# (1-q)/q, where q is the realized sampled positive fraction.  Therefore the
# expected positive/negative loss mass remains balanced instead of applying
# class reweighting twice.  FMT and same-width train-only Raw-PCA use exactly
# the same deterministic index sequence for each dataset/seed.
optimization_candidates:
  - {id: b00_control}
  - {id: b01_q005, training: {minibatch_positive_fraction: 0.05}}
  - {id: b02_q010, training: {minibatch_positive_fraction: 0.10}}
  - {id: b03_q020, training: {minibatch_positive_fraction: 0.20}}
  - {id: b04_q033, training: {minibatch_positive_fraction: 0.33}}
  - {id: b05_q050, training: {minibatch_positive_fraction: 0.50}}
  - {id: b06_q010_batch256,
     training: {minibatch_positive_fraction: 0.10, batch_size: 256}}
  - {id: b07_q020_batch256,
     training: {minibatch_positive_fraction: 0.20, batch_size: 256}}
  - {id: b08_q033_batch256,
     training: {minibatch_positive_fraction: 0.33, batch_size: 256}}
  - {id: b09_q050_batch256,
     training: {minibatch_positive_fraction: 0.50, batch_size: 256}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_average_precision_gain_vs_raw_pca
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  target_dataset_macro_f1_gain: 0.15
  confirmation_opened: false

