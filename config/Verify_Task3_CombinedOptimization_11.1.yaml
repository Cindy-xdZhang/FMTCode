experiment: Verify_Task3_CombinedOptimization_11.1
output_root: outputs/Verify_Task3_CombinedOptimization_11.1
task: Task3

base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

# These files are read only after their selectors complete.  Preflight freezes
# every SHA-256 and the exact family-specific winner IDs before any 11.1
# training starts.
combination_sources:
  loss:
    selection: outputs/Verify_Task3_LossOptimization_7.1/optimization_selection.json
    expected_experiment: Verify_Task3_LossOptimization_7.1
  hardness:
    selection: outputs/Verify_Task3_RawHardness_8.1/optimization_selection.json
    expected_experiment: Verify_Task3_RawHardness_8.1
  correction:
    selection: outputs/Verify_Task3_ResidualCorrection_9.1/optimization_selection.json
    expected_experiment: Verify_Task3_ResidualCorrection_9.1
  ranking:
    selection: outputs/Verify_Task3_PairwiseRanking_10.1/optimization_selection.json
    expected_experiment: Verify_Task3_PairwiseRanking_10.1

# Complete 2^4 factorial over the four frozen family-specific winners.  This
# grid is declared before 8.1-10.1 results exist and cannot be adapted to their
# measured gains.
optimization_candidates:
  - {id: m00_control, sources: []}
  - {id: m01_loss, sources: [loss]}
  - {id: m02_hardness, sources: [hardness]}
  - {id: m03_correction, sources: [correction]}
  - {id: m04_ranking, sources: [ranking]}
  - {id: m05_loss_hardness, sources: [loss, hardness]}
  - {id: m06_loss_correction, sources: [loss, correction]}
  - {id: m07_loss_ranking, sources: [loss, ranking]}
  - {id: m08_hardness_correction, sources: [hardness, correction]}
  - {id: m09_hardness_ranking, sources: [hardness, ranking]}
  - {id: m10_correction_ranking, sources: [correction, ranking]}
  - {id: m11_loss_hardness_correction,
     sources: [loss, hardness, correction]}
  - {id: m12_loss_hardness_ranking,
     sources: [loss, hardness, ranking]}
  - {id: m13_loss_correction_ranking,
     sources: [loss, correction, ranking]}
  - {id: m14_hardness_correction_ranking,
     sources: [hardness, correction, ranking]}
  - {id: m15_all,
     sources: [loss, hardness, correction, ranking]}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_average_precision_gain_vs_raw_pca
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  target_dataset_macro_f1_gain: 0.16
  confirmation_opened: false
