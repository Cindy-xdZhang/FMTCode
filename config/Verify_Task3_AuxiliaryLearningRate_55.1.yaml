experiment: Verify_Task3_AuxiliaryLearningRate_55.1
output_root: outputs/Verify_Task3_AuxiliaryLearningRate_55.1
task: Task3

# Development-only single-factor search. The trainable auxiliary projection
# receives a learning-rate multiplier while the downstream residual head keeps
# the frozen base learning rate. Both paired arms use the same multiplier.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# Log-spaced coverage around the exact historical multiplier-one control.
# c00 has no training override and preserves the old single optimizer group.
optimization_candidates:
  - {id: c00_control_auxlr1, sources: [feature]}
  - {id: c01_auxlr005, sources: [feature], training: {auxiliary_learning_rate_multiplier: 0.05}}
  - {id: c02_auxlr010, sources: [feature], training: {auxiliary_learning_rate_multiplier: 0.10}}
  - {id: c03_auxlr025, sources: [feature], training: {auxiliary_learning_rate_multiplier: 0.25}}
  - {id: c04_auxlr050, sources: [feature], training: {auxiliary_learning_rate_multiplier: 0.50}}
  - {id: c05_auxlr200, sources: [feature], training: {auxiliary_learning_rate_multiplier: 2.00}}
  - {id: c06_auxlr400, sources: [feature], training: {auxiliary_learning_rate_multiplier: 4.00}}
  - {id: c07_auxlr800, sources: [feature], training: {auxiliary_learning_rate_multiplier: 8.00}}
  - {id: c08_auxlr1600, sources: [feature], training: {auxiliary_learning_rate_multiplier: 16.00}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: c00_control_auxlr1
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.200
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
