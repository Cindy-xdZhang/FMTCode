experiment: Verify_Task3_AuxiliaryNormBias_67.1
output_root: outputs/Verify_Task3_AuxiliaryNormBias_67.1
task: Task3

# Development-only single-factor initialization search.  The independently
# audited 66.1 portfolio supplies one frozen recipe per physical family.  Any
# selected auxiliary normalization scale is preserved; only LayerNorm's
# trainable bias before GELU is initialized differently.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  portfolio:
    kind: optimization
    selection: outputs/Verify_Task3_AuxiliaryNormScalePortfolio_66.1/portfolio_selection.json
    expected_experiment: Verify_Task3_AuxiliaryNormScalePortfolio_66.1

# c00 exactly reproduces the source recipe (PyTorch LayerNorm beta=0).  Other
# cells change only the initial auxiliary-normalization bias.
optimization_candidates:
  - {id: c00_control_normbias, sources: [portfolio]}
  - {id: c01_normbias_m200, sources: [portfolio], model: {auxiliary_normalization_initial_bias: -2.0}}
  - {id: c02_normbias_m100, sources: [portfolio], model: {auxiliary_normalization_initial_bias: -1.0}}
  - {id: c03_normbias_m050, sources: [portfolio], model: {auxiliary_normalization_initial_bias: -0.50}}
  - {id: c04_normbias_m025, sources: [portfolio], model: {auxiliary_normalization_initial_bias: -0.25}}
  - {id: c05_normbias_m010, sources: [portfolio], model: {auxiliary_normalization_initial_bias: -0.10}}
  - {id: c06_normbias_p005, sources: [portfolio], model: {auxiliary_normalization_initial_bias: 0.05}}
  - {id: c07_normbias_p010, sources: [portfolio], model: {auxiliary_normalization_initial_bias: 0.10}}
  - {id: c08_normbias_p025, sources: [portfolio], model: {auxiliary_normalization_initial_bias: 0.25}}
  - {id: c09_normbias_p050, sources: [portfolio], model: {auxiliary_normalization_initial_bias: 0.50}}
  - {id: c10_normbias_p100, sources: [portfolio], model: {auxiliary_normalization_initial_bias: 1.0}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: c00_control_normbias
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.212
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
