task1:
  source_config: config/mainExp_Task1_3D_4.1_uniform.yaml
  main_summary: outputs/mainExp_Task1_3D_4.1_ibex/summary.json
  final_train: [0, 1, 2, 3, 4, 5, 6, 7]
  cluster_calibration: [8, 9]
  pca_dim: 8
  kmeans_seeds: [7080, 7081, 7082, 7083, 7084]
  kmeans_n_init: 20

task2:
  source_config: config/Verify_Task2_UniformFMT_6.1.yaml
  main_summary: outputs/mainExp_Task2_3D_6.2_uniform_confirmation/confirmation/summary.json
  architecture: l512_l64_b1e-6
  train: [0, 1, 2, 3, 4, 5]
  cluster_calibration: [6, 7]
  confirmation: [8, 9]
  training_seeds: [100, 101, 102, 103, 104]
  kmeans_seed: 7068
  kmeans_n_init: 20
  checkpoint_policy: no_checkpoints_written

# Every Task1/Task2 variant remains 189-dimensional. Removed information is
# replaced by zeros before train-only StandardScaler, so VAE architecture,
# latent width, optimizer, steps, and nominal parameter count remain exact.
canonical_variants:
  - {id: full, removes: nothing}
  - {id: without_chirality, removes: SO3_handedness_triple_products}
  - {id: without_cosine, removes: real_imaginary_angle_cosines}
  - {id: without_neighbor_fourier, removes: six_sorted_neighbor_Fourier_blocks}
  - {id: without_center_fourier, removes: center_pathline_Fourier_block}
  - {id: without_kinematic, removes: four_local_velocity_gradient_DFT_channels}
  - {id: kinematic_only, removes: all_161_Fourier_features}

task3:
  source_config: config/Verify_Task3_UniformFMT_9.1.yaml
  main_summary: outputs/mainExp_Task3_3D_9.2_uniform_confirmation/confirmation/summary.json
  train: [0, 1, 2, 3, 4, 5]
  validation: [6, 7]
  confirmation: [8, 9]
  seeds: [40, 41, 42, 43, 44]
  variants:
    - {id: first, source_candidate: g03_aivd1w3_first,
       interpretation: seed_time_IVD_like_value_without_Fourier}
    - {id: early, source_candidate: g07_aivd1w3_early,
       interpretation: first_and_early_mean_without_Fourier}
    - {id: dft, source_candidate: g08_aivd1w3_dft,
       interpretation: selected_one_bin_Fourier_summary}
  paired_sources: [fmt, raw_pca]
  checkpoint_policy: temporary_until_independent_audit_then_delete
