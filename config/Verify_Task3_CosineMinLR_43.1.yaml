experiment: Verify_Task3_CosineMinLR_43.1
output_root: outputs/Verify_Task3_CosineMinLR_43.1
task: Task3

# Adaptive development search declared without reading partial metrics from
# 35.1--42.1. It changes only the cosine scheduler and its terminal learning-
# rate ratio. Raw-PCA and FMT use the same schedule within every candidate.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0
  head_normalization: layernorm
  head_activation: gelu

combination_sources:
  feature:
    kind: stage1_feature
    selection: outputs/Verify_Task3_AnchoredFeatureDecomposition_22.1/stage1_selection.json
    expected_experiment: Verify_Task3_AnchoredFeatureDecomposition_22.1

# The control has no training override and executes the historical constant-
# learning-rate path. Ratios specify eta_min/base_lr for cosine annealing.
optimization_candidates:
  - {id: c00_control_constant, sources: [feature]}
  - {id: c01_ratio000, sources: [feature],
     training: {scheduler: cosine, minimum_learning_rate_ratio: 0.0}}
  - {id: c02_ratio0001, sources: [feature],
     training: {scheduler: cosine, minimum_learning_rate_ratio: 0.001}}
  - {id: c03_ratio001, sources: [feature],
     training: {scheduler: cosine, minimum_learning_rate_ratio: 0.01}}
  - {id: c04_ratio0025, sources: [feature],
     training: {scheduler: cosine, minimum_learning_rate_ratio: 0.025}}
  - {id: c05_ratio005, sources: [feature],
     training: {scheduler: cosine, minimum_learning_rate_ratio: 0.05}}
  - {id: c06_ratio010, sources: [feature],
     training: {scheduler: cosine, minimum_learning_rate_ratio: 0.10}}
  - {id: c07_ratio025, sources: [feature],
     training: {scheduler: cosine, minimum_learning_rate_ratio: 0.25}}
  - {id: c08_ratio050, sources: [feature],
     training: {scheduler: cosine, minimum_learning_rate_ratio: 0.50}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_fmt_f1
    - dataset_macro_average_precision_gain_vs_raw_pca
    - dataset_macro_fmt_average_precision
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  absolute_fmt_guard:
    control_optimization_id: c00_control_constant
    f1_tolerance: 0.0
    average_precision_tolerance: 0.0
  target_dataset_macro_f1_gain: 0.195
  target_absolute_fmt_f1: 0.893
  confirmation_opened: false
