experiment: Verify_Task3_ResidualCorrection_9.1
output_root: outputs/Verify_Task3_ResidualCorrection_9.1
task: Task3

# Orthogonal development-only search.  It uses the frozen 5.2 family recipes
# and the 6.1 deep-MLP winner, but no 7.1/8.1 ranking and no final population.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
base_search_config_sha256: c942fec55d841274c6850bc147d450c03b389609c130aa11bc4620b74361294f
upstream_selection: outputs/Verify_Task3_SpatialRobust_5.2/stage2_selection.json
upstream_selector_job_id: 50958095

paired_seeds: [40, 41, 42]

model_override:
  head_architecture: deep_mlp
  head_hidden_dim: 64
  head_depth: 2
  head_dropout: 0.0

# Both paired arms receive the same auxiliary target.  For each training
# sample, the frozen Raw logit and label determine the missing signed
# correction needed to reach raw_margin_target.  Smooth-L1 regularizes the
# residual prediction toward that correction; easy Raw samples target zero.
optimization_candidates:
  - {id: r00_control}
  - {id: r01_weight001, training: {raw_margin_loss_weight: 0.01}}
  - {id: r02_weight003, training: {raw_margin_loss_weight: 0.03}}
  - {id: r03_weight010, training: {raw_margin_loss_weight: 0.10}}
  - {id: r04_weight030, training: {raw_margin_loss_weight: 0.30}}
  - {id: r05_weight100, training: {raw_margin_loss_weight: 1.00}}
  - {id: r06_margin05,
     training: {raw_margin_loss_weight: 0.10, raw_margin_target: 0.5}}
  - {id: r07_margin20,
     training: {raw_margin_loss_weight: 0.10, raw_margin_target: 2.0}}
  - {id: r08_margin40,
     training: {raw_margin_loss_weight: 0.10, raw_margin_target: 4.0}}
  - {id: r09_margin20_delta025,
     training: {raw_margin_loss_weight: 0.10, raw_margin_target: 2.0,
                raw_margin_huber_delta: 0.25}}
  - {id: r10_margin20_delta20,
     training: {raw_margin_loss_weight: 0.10, raw_margin_target: 2.0,
                raw_margin_huber_delta: 2.0}}
  - {id: r11_margin20_cap8,
     training: {raw_margin_loss_weight: 0.10, raw_margin_target: 2.0,
                raw_margin_max_correction: 8.0}}
  - {id: r12_weight030_margin20_delta20,
     training: {raw_margin_loss_weight: 0.30, raw_margin_target: 2.0,
                raw_margin_huber_delta: 2.0}}

selection:
  primary_metric: dataset_macro_f1_gain_vs_raw_pca
  tie_breakers:
    - dataset_macro_average_precision_gain_vs_raw_pca
    - positive_dataset_count
    - worst_dataset_f1_gain
    - worst_seed_f1_gain
  target_dataset_macro_f1_gain: 0.15
  confirmation_opened: false
