# Frozen while 77.1 remains incomplete and before 100.1 can produce any
# portfolio metric. The independently audited 100.1 portfolio supplies one
# complete recipe per physical family. The exact source is the control; the
# remaining candidates change only the downstream residual-head learning rate.
base_search_config: config/Verify_Task3_SpatialRobust_5.2.yaml
