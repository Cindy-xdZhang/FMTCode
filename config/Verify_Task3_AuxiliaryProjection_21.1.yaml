    selection: outputs/Verify_Task3_UltraNarrowBottleneck_20.1/optimization_selection.json
    expected_experiment: Verify_Task3_UltraNarrowBottleneck_20.1

optimization_candidates:
  - id: p00_linear_layernorm_gelu_control
